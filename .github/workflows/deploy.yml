name: Production deployment

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY PRODUCTION exactly.
        required: true
        type: string
      migration_confirmation:
        description: Type RUN PRODUCTION MIGRATIONS exactly.
        required: true
        type: string
      config_sha256:
        description: Lowercase SHA-256 of the protected PRODUCTION_CONFIG_JSON value.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"
  AZURE_CORE_COLLECT_TELEMETRY: "0"
  AZURE_CORE_OUTPUT: none
  AZURE_EXTENSION_USE_DYNAMIC_INSTALL: "no"
  AZURE_LOGIN_PRE_CLEANUP: "true"
  AZURE_LOGIN_POST_CLEANUP: "true"
  DELIVERY_AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  DELIVERY_AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  DELIVERY_WHAT_IF_CLIENT_ID: ${{ vars.AZURE_WHAT_IF_CLIENT_ID }}
  DELIVERY_REGISTRY_PUSH_CLIENT_ID: ${{ vars.AZURE_REGISTRY_PUSH_CLIENT_ID }}
  DELIVERY_INFRA_DEPLOY_CLIENT_ID: ${{ vars.AZURE_INFRA_DEPLOY_CLIENT_ID }}
  DELIVERY_MIGRATION_RUNTIME_CLIENT_ID: ${{ vars.AZURE_MIGRATION_RUNTIME_CLIENT_ID }}

jobs:
  prepare-release:
    name: Tokenless acceptance and immutable release artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # This gate exposes the protected configuration, but this job has no OIDC permission.
    environment: production
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.4-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
        env:
          POSTGRES_DB: foundation_local
          POSTGRES_USER: foundation_local
          POSTGRES_PASSWORD: local-only-do-not-use-in-production
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=foundation_local --dbname=foundation_local"
          --health-interval 5s --health-timeout 5s --health-retries 12

    steps:
      - name: Guard manual target before checkout
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          MIGRATION_CONFIRMATION: ${{ inputs.migration_confirmation }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SELECTED_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$SELECTED_REF" = "refs/heads/$DEFAULT_BRANCH" || {
            echo "::error::Production deployment is restricted to the default branch."
            exit 1
          }
          test "$CONFIRMATION" = "DEPLOY PRODUCTION" || {
            echo "::error::The production deployment confirmation did not match."
            exit 1
          }
          test "$MIGRATION_CONFIRMATION" = "RUN PRODUCTION MIGRATIONS" || {
            echo "::error::The production migration confirmation did not match."
            exit 1
          }

      - name: Check out reviewed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install exact pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0
          run_install: false

      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify exact source toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || {
            echo "::error::The checkout does not match the workflow's reviewed commit."
            exit 1
          }
          test "$(node --version)" = "v$(cat .node-version)"
          test "$(pnpm --version)" = "11.17.0"

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Install verified Bicep CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .toolchain
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output .toolchain/bicep \
            https://github.com/Azure/bicep/releases/download/v0.45.15/bicep-linux-x64
          printf '%s  %s\n' \
            ff5b194b042c220df4a50d6768ed1d6c39a32894bfdc4ff83d62b115d966a7ce \
            .toolchain/bicep | sha256sum --check --strict
          chmod 0755 .toolchain/bicep
          echo "BICEP_CLI=.toolchain/bicep" >> "$GITHUB_ENV"

      - name: Validate confirmations and distinct delivery identities
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          MIGRATION_CONFIRMATION: ${{ inputs.migration_confirmation }}
          EXPECTED_CONFIG_SHA256: ${{ inputs.config_sha256 }}
          WHAT_IF_CLIENT_ID: ${{ vars.AZURE_WHAT_IF_CLIENT_ID }}
          REGISTRY_PUSH_CLIENT_ID: ${{ vars.AZURE_REGISTRY_PUSH_CLIENT_ID }}
          INFRA_DEPLOY_CLIENT_ID: ${{ vars.AZURE_INFRA_DEPLOY_CLIENT_ID }}
          MIGRATION_RUNTIME_CLIENT_ID: ${{ vars.AZURE_MIGRATION_RUNTIME_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SELECTED_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$SELECTED_REF" = "refs/heads/$DEFAULT_BRANCH"
          test "$CONFIRMATION" = "DEPLOY PRODUCTION"
          test "$MIGRATION_CONFIRMATION" = "RUN PRODUCTION MIGRATIONS"
          [[ "$EXPECTED_CONFIG_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "::error::A lowercase production configuration SHA-256 is required."
            exit 1
          }
          python3 - <<'PY'
          import os
          import re

          identity_names = (
              "WHAT_IF_CLIENT_ID",
              "REGISTRY_PUSH_CLIENT_ID",
              "INFRA_DEPLOY_CLIENT_ID",
              "MIGRATION_RUNTIME_CLIENT_ID",
          )
          uuid = re.compile(r"^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$", re.I)
          values = []
          for name in (*identity_names, "AZURE_TENANT_ID", "AZURE_SUBSCRIPTION_ID"):
              value = os.environ.get(name, "")
              if not uuid.fullmatch(value):
                  raise SystemExit(f"{name} must be a concrete UUID from protected variables.")
              if name in identity_names:
                  values.append(value.lower())
          if len(set(values)) != len(identity_names):
              raise SystemExit("Each Azure delivery duty must use a distinct federated client ID.")
          PY

      - name: Run deterministic quality, unit, build, specification, and infrastructure checks
        shell: bash
        run: |
          set -euo pipefail
          pnpm deps:audit
          pnpm format:check
          pnpm lint
          pnpm --filter @repo/ui check:colors
          pnpm typecheck
          pnpm test:unit
          pnpm spec:validate:all
          pnpm build
          pnpm infra:validate

      - name: Run migration and PostgreSQL integration acceptance
        env:
          RUNTIME_MODE: test
          DATABASE_MODE: local-password
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: "5432"
          DATABASE_NAME: foundation_local
          DATABASE_USER: foundation_local
          DATABASE_PASSWORD: local-only-do-not-use-in-production
          AUTH_MODE: disabled
          LOGGING_MODE: silent
          TELEMETRY_MODE: disabled
          NEXT_PUBLIC_RUNTIME_MODE: test
        run: |
          pnpm db:migrate:local
          pnpm test:integration

      - name: Restore trusted Playwright browser cache
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium and operating-system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @repo/web exec playwright install --with-deps chromium

      - name: Install Chromium operating-system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @repo/web exec playwright install-deps chromium

      - name: Run browser, smoke, and accessibility acceptance
        env:
          RUNTIME_MODE: production
          DATABASE_MODE: disabled
          AUTH_MODE: container-apps
          LOGGING_MODE: json
          TELEMETRY_MODE: disabled
          NEXT_PUBLIC_RUNTIME_MODE: production
        run: pnpm e2e

      - name: Verify reviewed source remained immutable
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=all)" || {
            echo "::error::Source checks created an unreviewed file or changed the reviewed checkout."
            git status --short
            exit 1
          }

      - name: Build release image without cloud credentials
        shell: bash
        run: |
          set -euo pipefail
          pnpm docker:build
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=all)" || {
            echo "::error::The image build changed the reviewed checkout."
            git status --short
            exit 1
          }
          container_name="agent-ready-starter-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup_container() {
            docker rm --force "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup_container EXIT
          cleanup_container
          docker run --detach \
            --name "$container_name" \
            --publish 127.0.0.1::3000 \
            --env RUNTIME_MODE=production \
            --env DATABASE_MODE=disabled \
            --env AUTH_MODE=container-apps \
            --env LOGGING_MODE=json \
            --env TELEMETRY_MODE=disabled \
            agent-ready-fullstack-on-azure-starter:local >/dev/null
          container_healthy="false"
          for _ in $(seq 1 30); do
            health="$(docker inspect --format '{{.State.Health.Status}}' "$container_name")"
            if [[ "$health" = "healthy" ]]; then
              container_healthy="true"
              break
            fi
            if [[ "$health" = "unhealthy" ]]; then
              docker logs "$container_name"
              exit 1
            fi
            sleep 2
          done
          test "$container_healthy" = "true"
          host_port="$(docker port "$container_name" 3000/tcp | sed -n 's/^127\.0\.0\.1://p')"
          [[ "$host_port" =~ ^[0-9]+$ ]]
          curl --proto '=http' --fail --silent --show-error \
            "http://127.0.0.1:${host_port}/health/live" >/dev/null
          curl --proto '=http' --fail --silent --show-error \
            "http://127.0.0.1:${host_port}/health/ready" >/dev/null
          docker exec "$container_name" test -r /app/migration/dist/migrate-production.mjs
          docker exec "$container_name" test -d /app/migration/migrations
          cleanup_container
          trap - EXIT
          docker tag agent-ready-fullstack-on-azure-starter:local \
            "agent-ready-fullstack-on-azure-starter-candidate:${GITHUB_SHA}"

      - name: Compile template and seal source and image artifacts
        shell: bash
        env:
          EXPECTED_CONFIG_SHA256: ${{ inputs.config_sha256 }}
          PRODUCTION_CONFIG_JSON: ${{ secrets.PRODUCTION_CONFIG_JSON }}
          WHAT_IF_CLIENT_ID: ${{ vars.AZURE_WHAT_IF_CLIENT_ID }}
          REGISTRY_PUSH_CLIENT_ID: ${{ vars.AZURE_REGISTRY_PUSH_CLIENT_ID }}
          INFRA_DEPLOY_CLIENT_ID: ${{ vars.AZURE_INFRA_DEPLOY_CLIENT_ID }}
          MIGRATION_RUNTIME_CLIENT_ID: ${{ vars.AZURE_MIGRATION_RUNTIME_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          SELECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          source_dir="delivery-artifacts/release-source"
          image_dir="delivery-artifacts/release-image"
          protected_dir="delivery-artifacts/protected-release"
          protected_config="$protected_dir/production.config.json"
          mkdir -p "$source_dir" "$image_dir" "$protected_dir"
          umask 077

          test -n "$PRODUCTION_CONFIG_JSON" || {
            echo "::error::The protected production configuration is missing."
            exit 1
          }
          printf '%s' "$PRODUCTION_CONFIG_JSON" > "$protected_config"
          actual_config_sha256="$(sha256sum "$protected_config" | cut -d ' ' -f 1)"
          test "$actual_config_sha256" = "$EXPECTED_CONFIG_SHA256" || {
            echo "::error::The protected production configuration digest did not match."
            exit 1
          }
          node infra/scripts/preflight.mjs --config "$protected_config"
          PROTECTED_CONFIG="$protected_config" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          config = json.loads(
              Path(os.environ["PROTECTED_CONFIG"]).read_text(encoding="utf-8")
          )
          if str(config.get("auth", {}).get("tenantId", "")).lower() != os.environ["AZURE_TENANT_ID"].lower():
              raise SystemExit("The deployment and workload-federation tenant IDs must match.")
          if config.get("image", {}).get("tag") != os.environ["SELECTED_SHA"]:
              raise SystemExit("The production image tag must equal the reviewed full commit SHA.")
          if config.get("features", {}).get("enableFoundry") is not False:
              raise SystemExit("Foundry must remain disabled for this deployment.")
          query_client_id = (
              config.get("monitoring", {})
              .get("queryAccess", {})
              .get("clientId", "")
              .lower()
          )
          if query_client_id != os.environ["MIGRATION_RUNTIME_CLIENT_ID"].lower():
              raise SystemExit(
                  "The rollout query role must target the migration/runtime federated identity."
              )
          PY
          printf '%s  %s\n' \
            ff5b194b042c220df4a50d6768ed1d6c39a32894bfdc4ff83d62b115d966a7ce \
            .toolchain/bicep | sha256sum --check --strict
          .toolchain/bicep build infra/main.bicep \
            --outfile "$source_dir/main.json" \
            --no-restore

          template_sha256="$(sha256sum "$source_dir/main.json" | cut -d ' ' -f 1)"
          bicep_sha256="$(
            find infra -type f \( -name '*.bicep' -o -name 'bicepconfig.json' \) -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum \
              | sha256sum \
              | cut -d ' ' -f 1
          )"
          image_id="$(
            docker image inspect --format '{{.Id}}' \
              "agent-ready-fullstack-on-azure-starter-candidate:${GITHUB_SHA}"
          )"
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker save --output "$image_dir/candidate-image.tar" \
            "agent-ready-fullstack-on-azure-starter-candidate:${GITHUB_SHA}"
          image_tar_sha256="$(sha256sum "$image_dir/candidate-image.tar" | cut -d ' ' -f 1)"

          export SOURCE_DIR="$source_dir"
          export IMAGE_DIR="$image_dir"
          export CONFIG_SHA256="$actual_config_sha256"
          export TEMPLATE_SHA256="$template_sha256"
          export BICEP_SHA256="$bicep_sha256"
          export IMAGE_ID="$image_id"
          export IMAGE_TAR_SHA256="$image_tar_sha256"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          release = {
              "schemaVersion": 1,
              "runId": os.environ["GITHUB_RUN_ID"],
              "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "commitSha": os.environ["GITHUB_SHA"],
              "configSha256": os.environ["CONFIG_SHA256"],
              "bicepSha256": os.environ["BICEP_SHA256"],
              "templateSha256": os.environ["TEMPLATE_SHA256"],
              "imageId": os.environ["IMAGE_ID"],
              "azureTarget": {
                  "tenantId": os.environ["AZURE_TENANT_ID"].lower(),
                  "subscriptionId": os.environ["AZURE_SUBSCRIPTION_ID"].lower(),
              },
              "federatedClientIds": {
                  "whatIf": os.environ["WHAT_IF_CLIENT_ID"].lower(),
                  "registryPush": os.environ["REGISTRY_PUSH_CLIENT_ID"].lower(),
                  "infrastructureDeployment": os.environ[
                      "INFRA_DEPLOY_CLIENT_ID"
                  ].lower(),
                  "migrationRuntime": os.environ[
                      "MIGRATION_RUNTIME_CLIENT_ID"
                  ].lower(),
              },
          }
          source_dir = Path(os.environ["SOURCE_DIR"])
          image_dir = Path(os.environ["IMAGE_DIR"])
          source_dir.joinpath("release-evidence.json").write_text(
              json.dumps(release, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          image = {
              **release,
              "imageTarSha256": os.environ["IMAGE_TAR_SHA256"],
          }
          image_dir.joinpath("image-build-evidence.json").write_text(
              json.dumps(image, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

          (
            cd "$source_dir"
            sha256sum main.json release-evidence.json > release.sha256
          )
          (
            cd "$image_dir"
            sha256sum candidate-image.tar image-build-evidence.json > image.sha256
          )

      - name: Upload immutable deployment source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-release-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: delivery-artifacts/release-source
          if-no-files-found: error
          retention-days: 7

      - name: Upload tokenless image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-release-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: delivery-artifacts/release-image
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Remove local release material
        if: always()
        shell: bash
        run: |
          rm -rf delivery-artifacts .toolchain
          docker image rm \
            "agent-ready-fullstack-on-azure-starter-candidate:${GITHUB_SHA}" \
            agent-ready-fullstack-on-azure-starter:local >/dev/null 2>&1 || true

  plan-foundation:
    name: OIDC what-if identity (foundation)
    needs: prepare-release
    runs-on:
      group: production-vnet-runners
      labels:
        - self-hosted
        - linux
        - x64
        - vnet-connected
        - production
        - azure-cli-2-88-0
    timeout-minutes: 35
    environment: production
    permissions:
      id-token: write
    env:
      AZURE_CONFIG_DIR: ${{ github.workspace }}/.azure-foundation-plan

    steps:
      - name: Reset runner-local delivery state
        shell: bash
        run: rm -rf -- delivery-artifacts "$AZURE_CONFIG_DIR"

      - name: Download immutable deployment source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-release-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: delivery-artifacts/release-source

      - name: Verify source evidence and prepare foundation parameters before OIDC
        shell: bash
        env:
          EXPECTED_CONFIG_SHA256: ${{ inputs.config_sha256 }}
          EXPECTED_SHA: ${{ github.sha }}
          PRODUCTION_CONFIG_JSON: ${{ secrets.PRODUCTION_CONFIG_JSON }}
        run: |
          set -euo pipefail
          source_dir="delivery-artifacts/release-source"
          state_dir="delivery-artifacts/private-foundation-plan"
          config_path="$state_dir/production.config.json"
          parameters_path="$state_dir/foundation.parameters.json"
          mkdir -p "$state_dir"
          umask 077
          test -n "$PRODUCTION_CONFIG_JSON"
          printf '%s' "$PRODUCTION_CONFIG_JSON" > "$config_path"
          test "$(sha256sum "$config_path" | cut -d ' ' -f 1)" = "$EXPECTED_CONFIG_SHA256"
          (cd "$source_dir" && sha256sum --check --strict release.sha256)
          test "$(az version --query '"azure-cli"' --output tsv)" = "2.88.0"
          export SOURCE_DIR="$source_dir"
          export CONFIG_PATH="$config_path"
          export PARAMETERS_PATH="$parameters_path"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["SOURCE_DIR"])
          evidence = json.loads((root / "release-evidence.json").read_text(encoding="utf-8"))
          expected = {
              "schemaVersion": 1,
              "runId": os.environ["GITHUB_RUN_ID"],
              "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "commitSha": os.environ["EXPECTED_SHA"],
              "configSha256": os.environ["EXPECTED_CONFIG_SHA256"],
          }
          for key, value in expected.items():
              if evidence.get(key) != value:
                  raise SystemExit(f"Release evidence mismatch for {key}.")
          if hashlib.sha256((root / "main.json").read_bytes()).hexdigest() != evidence["templateSha256"]:
              raise SystemExit("Compiled template digest does not match release evidence.")
          expected_target = {
             "tenantId": os.environ["DELIVERY_AZURE_TENANT_ID"].lower(),
             "subscriptionId": os.environ["DELIVERY_AZURE_SUBSCRIPTION_ID"].lower(),
          }
          expected_identities = {
             "whatIf": os.environ["DELIVERY_WHAT_IF_CLIENT_ID"].lower(),
             "registryPush": os.environ["DELIVERY_REGISTRY_PUSH_CLIENT_ID"].lower(),
             "infrastructureDeployment": os.environ[
                 "DELIVERY_INFRA_DEPLOY_CLIENT_ID"
             ].lower(),
             "migrationRuntime": os.environ[
                 "DELIVERY_MIGRATION_RUNTIME_CLIENT_ID"
             ].lower(),
          }
          if (
             evidence.get("azureTarget") != expected_target
             or evidence.get("federatedClientIds") != expected_identities
          ):
             raise SystemExit("Release evidence does not match the current Azure target identities.")
          config = json.loads(Path(os.environ["CONFIG_PATH"]).read_text(encoding="utf-8"))
          parameters = {
              "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
              "contentVersion": "1.0.0.0",
              "parameters": {
                  "config": {"value": config},
                  "enableFoundry": {"value": False},
                  "deploymentStage": {"value": "foundation"},
                  "imageDigest": {"value": ""},
                  "previousRevisionName": {"value": ""},
                  "webRevisionSuffix": {"value": ""},
              },
          }
          Path(os.environ["PARAMETERS_PATH"]).write_text(
              json.dumps(parameters, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          echo "SOURCE_DIR=$source_dir" >> "$GITHUB_ENV"
          echo "CONFIG_PATH=$config_path" >> "$GITHUB_ENV"
          echo "PARAMETERS_PATH=$parameters_path" >> "$GITHUB_ENV"

      - name: Log in with the what-if federated identity
        uses: Azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_WHAT_IF_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: false

      - name: Produce foundation what-if evidence
        shell: bash
        run: |
          set -euo pipefail
          source_dir="delivery-artifacts/release-source"
          plan_dir="delivery-artifacts/foundation-plan"
          mkdir -p "$plan_dir"
          location="$(
            python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["primaryLocation"])' \
              "$CONFIG_PATH"
          )"
          account_path="$(dirname "$CONFIG_PATH")/account.json"
          az account show --output json > "$account_path"
          SOURCE_EVIDENCE="$source_dir/release-evidence.json" \
            ACCOUNT_PATH="$account_path" EXPECTED_PURPOSE="whatIf" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = json.loads(
              Path(os.environ["SOURCE_EVIDENCE"]).read_text(encoding="utf-8")
          )
          account = json.loads(Path(os.environ["ACCOUNT_PATH"]).read_text(encoding="utf-8"))
          target = evidence["azureTarget"]
          identities = evidence["federatedClientIds"]
          current_target = {
              "tenantId": os.environ["DELIVERY_AZURE_TENANT_ID"].lower(),
              "subscriptionId": os.environ["DELIVERY_AZURE_SUBSCRIPTION_ID"].lower(),
          }
          current_identities = {
              "whatIf": os.environ["DELIVERY_WHAT_IF_CLIENT_ID"].lower(),
              "registryPush": os.environ["DELIVERY_REGISTRY_PUSH_CLIENT_ID"].lower(),
              "infrastructureDeployment": os.environ[
                  "DELIVERY_INFRA_DEPLOY_CLIENT_ID"
              ].lower(),
              "migrationRuntime": os.environ[
                  "DELIVERY_MIGRATION_RUNTIME_CLIENT_ID"
              ].lower(),
          }
          purpose = os.environ["EXPECTED_PURPOSE"]
          if target != current_target or identities != current_identities:
              raise SystemExit("Azure target variables changed after release preparation.")
          if (
              str(account.get("tenantId", "")).lower() != target["tenantId"]
              or str(account.get("id", "")).lower() != target["subscriptionId"]
              or str(account.get("user", {}).get("type", "")).lower()
              != "serviceprincipal"
              or str(account.get("user", {}).get("name", "")).lower()
              != identities[purpose]
          ):
              raise SystemExit("The authenticated Azure account does not match reviewed evidence.")
          PY
          az deployment sub what-if \
            --name "foundation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --location "$location" \
            --template-file "$source_dir/main.json" \
            --parameters "@$PARAMETERS_PATH" \
            --result-format FullResourcePayloads \
            --no-pretty-print \
            --only-show-errors \
            --output json > "$(dirname "$CONFIG_PATH")/foundation.what-if.raw.json"

          export SOURCE_DIR="$source_dir"
          export PLAN_DIR="$plan_dir"
          export RAW_WHAT_IF_PATH="$(dirname "$CONFIG_PATH")/foundation.what-if.raw.json"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          source = Path(os.environ["SOURCE_DIR"])
          plan = Path(os.environ["PLAN_DIR"])
          release = json.loads((source / "release-evidence.json").read_text(encoding="utf-8"))
          raw_path = Path(os.environ["RAW_WHAT_IF_PATH"])
          result = json.loads(raw_path.read_text(encoding="utf-8"))
          changes = result.get("properties", {}).get("changes")
          if not isinstance(changes, list):
              raise SystemExit("Foundation what-if returned an invalid result.")

          allowed_types = {"Create", "Deploy", "Modify", "NoChange"}
          rejected_types = {"Delete", "Ignore", "Unsupported"}
          rejected = sorted(
              {
                  str(change.get("changeType", ""))
                  for change in changes
                  if change.get("changeType") not in allowed_types
              }
          )
          if rejected:
              raise SystemExit(
                  f"Foundation what-if contains rejected change types: {rejected}."
              )

          config = json.loads(Path(os.environ["CONFIG_PATH"]).read_text(encoding="utf-8"))
          web_resource = (
              f'/containerapps/{config["names"]["webContainerApp"]}'.lower()
          )
          job_resource = f'/jobs/{config["names"]["migrationJob"]}'.lower()

          def enforce_policy(value, path=""):
              if isinstance(value, dict):
                  action = str(value.get("action", "")).lower()
                  ip_range = str(value.get("ipAddressRange", ""))
                  if action == "allow" and ip_range == "0.0.0.0/0":
                      raise SystemExit(f"Unsafe allow-all network rule at {path}.")
                  for key, child in value.items():
                      child_path = f"{path}.{key}" if path else key
                      lowered = key.lower()
                      if (
                          lowered.startswith("publicnetworkaccess")
                          and child != "Disabled"
                      ):
                          raise SystemExit(
                              f"Public data-plane access is not disabled at {child_path}."
                          )
                      if lowered == "allowinsecure" and child is True:
                          raise SystemExit(f"Insecure ingress is enabled at {child_path}.")
                      if (
                          lowered == "unauthenticatedclientaction"
                          and child == "AllowAnonymous"
                      ):
                          raise SystemExit(
                              f"Anonymous application access is enabled at {child_path}."
                          )
                      enforce_policy(child, child_path)
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      enforce_policy(child, f"{path}[{index}]")

          for change in changes:
              resource_id = str(change.get("resourceId", "")).lower()
              if web_resource in resource_id or job_resource in resource_id:
                  raise SystemExit(
                      "Foundation stage may not create or modify application workload resources."
                  )
              enforce_policy(change.get("after"), resource_id)

          sensitive = re.compile(
              r"(secret|password|token|credential|connectionstring|privatekey|certificate)",
              re.I,
          )
          visible = re.compile(
              r"(name|type|location|kind|sku|tier|capacity|zones|version|publicnetworkaccess|"
              r"external|ipsecurityrestrictions|ipaddressrange|action|traffic|route|dns|"
              r"fqdn|host|domain|address|subnet|groupids|principal|roledefinition|identity|"
              r"audience|issuer|transport|targetport|image|command|args|replica|scale|tls)",
              re.I,
          )
          subscription_id = release["azureTarget"]["subscriptionId"]

          def canonical(value):
              if isinstance(value, dict):
                  return {key: canonical(value[key]) for key in sorted(value)}
              if isinstance(value, list):
                  items = [canonical(item) for item in value]
                  if items and all(isinstance(item, dict) for item in items):
                      if all("resourceId" in item for item in items):
                          items.sort(key=lambda item: str(item["resourceId"]).lower())
                      elif all("path" in item for item in items):
                          items.sort(key=lambda item: str(item["path"]))
                  return items
              return value

          def digest(value):
              payload = json.dumps(
                  canonical(value), sort_keys=True, separators=(",", ":")
              ).encode()
              return hashlib.sha256(payload).hexdigest()

          def safe_value(path, value):
              if value is None or isinstance(value, (bool, int, float)):
                  return value
              if sensitive.search(path):
                  return {"redacted": True, "type": type(value).__name__}
              if isinstance(value, str) and visible.search(path):
                  return value.replace(subscription_id, "<subscription>")
              return {"sha256": digest(value), "redacted": True}

          def flatten(value, path=""):
              rows = []
              if isinstance(value, dict):
                  for key in sorted(value):
                      child_path = f"{path}.{key}" if path else key
                      rows.extend(flatten(value[key], child_path))
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      rows.extend(flatten(child, f"{path}[{index}]"))
              else:
                  rows.append(
                      {
                          "path": path,
                          "propertyChangeType": "Create",
                          "after": safe_value(path, value),
                      }
                  )
              return rows

          def flatten_delta(entries):
              rows = []
              for entry in entries or []:
                  path = str(entry.get("path", ""))
                  children = entry.get("children")
                  if children:
                      rows.extend(flatten_delta(children))
                  else:
                      row = {
                          "path": path,
                          "propertyChangeType": entry.get(
                              "propertyChangeType", "Modify"
                          ),
                      }
                      if "before" in entry:
                          row["before"] = safe_value(path, entry.get("before"))
                      if "after" in entry:
                          row["after"] = safe_value(path, entry.get("after"))
                      rows.append(row)
              return sorted(rows, key=lambda row: row["path"])

          review_changes = []
          for change in sorted(
              changes, key=lambda item: str(item.get("resourceId", "")).lower()
          ):
              change_type = str(change.get("changeType", ""))
              properties = (
                  flatten(change.get("after"))
                  if change_type == "Create"
                  else flatten_delta(change.get("delta", []))
              )
              if change_type == "Modify" and not properties:
                  properties = flatten(change.get("after"))
              review_changes.append(
                  {
                      "resourceId": str(change.get("resourceId", "")).replace(
                          subscription_id, "<subscription>"
                      ),
                      "changeType": change_type,
                      "propertyChanges": properties,
                  }
              )

          review = {
              "schemaVersion": 1,
              "policyVersion": "azure-what-if-v1",
              "stage": "foundation",
              "allowedChangeTypes": sorted(allowed_types),
              "rejectedChangeTypes": sorted(rejected_types),
              "changeSummary": {
                  change_type: sum(
                      1
                      for change in changes
                      if change.get("changeType") == change_type
                  )
                  for change_type in sorted(
                      {str(change.get("changeType", "")) for change in changes}
                  )
              },
              "changes": review_changes,
          }
          review_path = plan / "foundation.what-if.review.json"
          review_path.write_text(
              json.dumps(review, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          raw_canonical = json.dumps(
              canonical(result), sort_keys=True, separators=(",", ":")
          ).encode()
          evidence = {
              **release,
              "stage": "foundation",
              "identityPurpose": "what-if",
              "parametersSha256": hashlib.sha256(
                  Path(os.environ["PARAMETERS_PATH"]).read_bytes()
              ).hexdigest(),
              "whatIfStateSha256": hashlib.sha256(raw_canonical).hexdigest(),
              "whatIfReviewSha256": hashlib.sha256(
                  review_path.read_bytes()
              ).hexdigest(),
              "whatIfPolicyVersion": "azure-what-if-v1",
          }
          plan.joinpath("foundation-plan-evidence.json").write_text(
              json.dumps(evidence, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          (
            cd "$plan_dir"
            sha256sum \
              foundation.what-if.review.json \
              foundation-plan-evidence.json > foundation-plan.sha256
          )

      - name: Upload foundation what-if for protected review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-foundation-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: delivery-artifacts/foundation-plan
          if-no-files-found: error
          retention-days: 30

      - name: Clear Azure session and protected files
        if: always()
        shell: bash
        run: |
          az logout >/dev/null 2>&1 || true
          az account clear >/dev/null 2>&1 || true
          rm -rf delivery-artifacts "$AZURE_CONFIG_DIR"

  deploy-foundation:
    name: Protected gate and infrastructure identity (foundation)
    needs: plan-foundation
    runs-on:
      group: production-vnet-runners
      labels:
        - self-hosted
        - linux
        - x64
        - vnet-connected
        - production
        - azure-cli-2-88-0
    timeout-minutes: 60
    # Required reviewers inspect the preceding same-run plan artifact before approving this job.
    environment: production
    permissions:
      id-token: write
    env:
      AZURE_CONFIG_DIR: ${{ github.workspace }}/.azure-foundation-deploy

    steps:
      - name: Reset runner-local delivery state
        shell: bash
        run: rm -rf -- delivery-artifacts "$AZURE_CONFIG_DIR"

      - name: Download immutable source and reviewed foundation plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern:
            production-{release-source,foundation-plan}-${{ github.run_id }}-${{ github.run_attempt
            }}
          path: delivery-artifacts
          merge-multiple: false

      - name: Verify reviewed foundation evidence before OIDC
        shell: bash
        env:
          EXPECTED_CONFIG_SHA256: ${{ inputs.config_sha256 }}
          EXPECTED_SHA: ${{ github.sha }}
          PRODUCTION_CONFIG_JSON: ${{ secrets.PRODUCTION_CONFIG_JSON }}
        run: |
          set -euo pipefail
          source_dir="delivery-artifacts/production-release-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          plan_dir="delivery-artifacts/production-foundation-plan-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          state_dir="delivery-artifacts/private-foundation-deploy"
          config_path="$state_dir/production.config.json"
          parameters_path="$state_dir/foundation.parameters.json"
          mkdir -p "$state_dir"
          umask 077
          test -n "$PRODUCTION_CONFIG_JSON"
          printf '%s' "$PRODUCTION_CONFIG_JSON" > "$config_path"
          test "$(sha256sum "$config_path" | cut -d ' ' -f 1)" = "$EXPECTED_CONFIG_SHA256"
          (cd "$source_dir" && sha256sum --check --strict release.sha256)
          (cd "$plan_dir" && sha256sum --check --strict foundation-plan.sha256)
          test "$(az version --query '"azure-cli"' --output tsv)" = "2.88.0"
          export SOURCE_DIR="$source_dir"
          export PLAN_DIR="$plan_dir"
          export CONFIG_PATH="$config_path"
          export PARAMETERS_PATH="$parameters_path"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          source = Path(os.environ["SOURCE_DIR"])
          plan = Path(os.environ["PLAN_DIR"])
          release = json.loads((source / "release-evidence.json").read_text(encoding="utf-8"))
          evidence = json.loads((plan / "foundation-plan-evidence.json").read_text(encoding="utf-8"))
          if hashlib.sha256((source / "main.json").read_bytes()).hexdigest() != release["templateSha256"]:
              raise SystemExit("Compiled template digest changed before foundation deployment.")
          if hashlib.sha256(Path(os.environ["CONFIG_PATH"]).read_bytes()).hexdigest() != release["configSha256"]:
              raise SystemExit("Production configuration digest changed before foundation deployment.")
          for key in (
              "runId", "runAttempt", "commitSha", "configSha256",
              "bicepSha256", "templateSha256", "imageId",
              "azureTarget", "federatedClientIds",
          ):
              if evidence.get(key) != release.get(key):
                  raise SystemExit(f"Foundation plan is not bound to release field {key}.")
          if release["commitSha"] != os.environ["EXPECTED_SHA"]:
              raise SystemExit("Release commit does not match this workflow.")
          if release["configSha256"] != os.environ["EXPECTED_CONFIG_SHA256"]:
              raise SystemExit("Release configuration does not match this workflow.")
          if evidence.get("stage") != "foundation" or evidence.get("identityPurpose") != "what-if":
              raise SystemExit("Foundation plan stage or identity purpose is invalid.")
          if evidence.get("whatIfPolicyVersion") != "azure-what-if-v1":
              raise SystemExit("Foundation what-if policy version is invalid.")
          if hashlib.sha256((plan / "foundation.what-if.review.json").read_bytes()).hexdigest() != evidence["whatIfReviewSha256"]:
              raise SystemExit("Foundation what-if digest changed after review.")
          expected_target = {
              "tenantId": os.environ["DELIVERY_AZURE_TENANT_ID"].lower(),
              "subscriptionId": os.environ["DELIVERY_AZURE_SUBSCRIPTION_ID"].lower(),
          }
          expected_identities = {
              "whatIf": os.environ["DELIVERY_WHAT_IF_CLIENT_ID"].lower(),
              "registryPush": os.environ["DELIVERY_REGISTRY_PUSH_CLIENT_ID"].lower(),
              "infrastructureDeployment": os.environ[
                  "DELIVERY_INFRA_DEPLOY_CLIENT_ID"
              ].lower(),
              "migrationRuntime": os.environ[
                  "DELIVERY_MIGRATION_RUNTIME_CLIENT_ID"
              ].lower(),
          }
          if (
              release.get("azureTarget") != expected_target
              or release.get("federatedClientIds") != expected_identities
          ):
              raise SystemExit("Azure target identities changed after foundation review.")
          config = json.loads(Path(os.environ["CONFIG_PATH"]).read_text(encoding="utf-8"))
          parameters = {
              "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
              "contentVersion": "1.0.0.0",
              "parameters": {
                  "config": {"value": config},
                  "enableFoundry": {"value": False},
                  "deploymentStage": {"value": "foundation"},
                  "imageDigest": {"value": ""},
                  "previousRevisionName": {"value": ""},
                  "webRevisionSuffix": {"value": ""},
              },
          }
          parameter_bytes = (
              json.dumps(parameters, sort_keys=True, separators=(",", ":")) + "\n"
          ).encode()
          if hashlib.sha256(parameter_bytes).hexdigest() != evidence["parametersSha256"]:
              raise SystemExit("Re-materialized foundation parameters differ from review.")
          Path(os.environ["PARAMETERS_PATH"]).write_bytes(parameter_bytes)
          PY
          echo "SOURCE_DIR=$source_dir" >> "$GITHUB_ENV"
          echo "PLAN_DIR=$plan_dir" >> "$GITHUB_ENV"
          echo "CONFIG_PATH=$config_path" >> "$GITHUB_ENV"
          echo "PARAMETERS_PATH=$parameters_path" >> "$GITHUB_ENV"

      - name: Log in with the infrastructure deployment federated identity
        uses: Azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_INFRA_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: false

      - name: Provision prerequisites without an application revision
        shell: bash
        run: |
          set -euo pipefail
          location="$(
            python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["primaryLocation"])' \
              "$CONFIG_PATH"
          )"
          account_path="$(dirname "$CONFIG_PATH")/account.json"
          az account show --output json > "$account_path"
          SOURCE_EVIDENCE="$SOURCE_DIR/release-evidence.json" \
            ACCOUNT_PATH="$account_path" EXPECTED_PURPOSE="infrastructureDeployment" \
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = json.loads(
              Path(os.environ["SOURCE_EVIDENCE"]).read_text(encoding="utf-8")
          )
          account = json.loads(Path(os.environ["ACCOUNT_PATH"]).read_text(encoding="utf-8"))
          target = evidence["azureTarget"]
          identities = evidence["federatedClientIds"]
          if target != {
              "tenantId": os.environ["DELIVERY_AZURE_TENANT_ID"].lower(),
              "subscriptionId": os.environ["DELIVERY_AZURE_SUBSCRIPTION_ID"].lower(),
          }:
              raise SystemExit("Azure target variables changed after foundation review.")
          if identities != {
              "whatIf": os.environ["DELIVERY_WHAT_IF_CLIENT_ID"].lower(),
              "registryPush": os.environ["DELIVERY_REGISTRY_PUSH_CLIENT_ID"].lower(),
              "infrastructureDeployment": os.environ[
                  "DELIVERY_INFRA_DEPLOY_CLIENT_ID"
              ].lower(),
              "migrationRuntime": os.environ[
                  "DELIVERY_MIGRATION_RUNTIME_CLIENT_ID"
              ].lower(),
          }:
              raise SystemExit("Federated client IDs changed after foundation review.")
          if (
              str(account.get("tenantId", "")).lower() != target["tenantId"]
              or str(account.get("id", "")).lower() != target["subscriptionId"]
              or str(account.get("user", {}).get("type", "")).lower()
              != "serviceprincipal"
              or str(account.get("user", {}).get("name", "")).lower()
              != identities[os.environ["EXPECTED_PURPOSE"]]
          ):
              raise SystemExit("The authenticated deployment identity is not reviewed.")
          PY
          fresh_what_if="$(dirname "$CONFIG_PATH")/foundation.what-if.fresh.json"
          az deployment sub what-if \
            --name "foundation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --location "$location" \
            --template-file "$SOURCE_DIR/main.json" \
            --parameters "@$PARAMETERS_PATH" \
            --result-format FullResourcePayloads \
            --no-pretty-print \
            --only-show-errors \
            --output json > "$fresh_what_if"
          FRESH_WHAT_IF="$fresh_what_if" \
            PLAN_EVIDENCE="$PLAN_DIR/foundation-plan-evidence.json" python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def canonical(value):
              if isinstance(value, dict):
                  return {key: canonical(value[key]) for key in sorted(value)}
              if isinstance(value, list):
                  items = [canonical(item) for item in value]
                  if items and all(isinstance(item, dict) for item in items):
                      if all("resourceId" in item for item in items):
                          items.sort(key=lambda item: str(item["resourceId"]).lower())
                      elif all("path" in item for item in items):
                          items.sort(key=lambda item: str(item["path"]))
                  return items
              return value

          result = json.loads(
              Path(os.environ["FRESH_WHAT_IF"]).read_text(encoding="utf-8")
          )
          changes = result.get("properties", {}).get("changes")
          if not isinstance(changes, list):
              raise SystemExit("Fresh foundation what-if returned an invalid result.")
          allowed_types = {"Create", "Deploy", "Modify", "NoChange"}
          rejected = {
              str(change.get("changeType", ""))
              for change in changes
              if change.get("changeType") not in allowed_types
          }
          if rejected:
              raise SystemExit(f"Fresh foundation what-if is unsafe: {sorted(rejected)}.")
          reviewed = json.loads(
              Path(os.environ["PLAN_EVIDENCE"]).read_text(encoding="utf-8")
          )
          payload = json.dumps(
              canonical(result), sort_keys=True, separators=(",", ":")
          ).encode()
          if hashlib.sha256(payload).hexdigest() != reviewed["whatIfStateSha256"]:
              raise SystemExit(
                  "Azure state changed after foundation review; re-plan is required."
              )
          PY
          az deployment sub create \
            --name "foundation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --location "$location" \
            --template-file "$SOURCE_DIR/main.json" \
            --parameters "@$PARAMETERS_PATH" \
            --only-show-errors \
            --output none

      - name: Clear Azure session and protected files
        if: always()
        shell: bash
        run: |
          az logout >/dev/null 2>&1 || true
          az account clear >/dev/null 2>&1 || true
          rm -rf delivery-artifacts "$AZURE_CONFIG_DIR"

  push-image:
    name: Registry push federated identity and digest proof
    needs: deploy-foundation
    runs-on:
      group: production-vnet-runners
      labels:
        - self-hosted
        - linux
        - x64
        - vnet-connected
        - production
        - azure-cli-2-88-0
    timeout-minutes: 45
    environment: production
    permissions:
      id-token: write
    env:
      AZURE_CONFIG_DIR: ${{ github.workspace }}/.azure-registry-push
      DOCKER_CONFIG: ${{ github.workspace }}/.docker-registry-push

    steps:
      - name: Reset runner-local delivery state
        shell: bash
        run: rm -rf -- delivery-artifacts "$AZURE_CONFIG_DIR" "$DOCKER_CONFIG"

      - name: Download immutable source and tokenless image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: production-release-{source,image}-${{ github.run_id }}-${{ github.run_attempt }}
          path: delivery-artifacts
          merge-multiple: false

      - name: Verify source, image, runner, and private path before OIDC
        shell: bash
        env:
          EXPECTED_CONFIG_SHA256: ${{ inputs.config_sha256 }}
          EXPECTED_SHA: ${{ github.sha }}
          PRODUCTION_CONFIG_JSON: ${{ secrets.PRODUCTION_CONFIG_JSON }}
        run: |
          set -euo pipefail
          source_dir="delivery-artifacts/production-release-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image_dir="delivery-artifacts/production-release-image-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          state_dir="delivery-artifacts/private-registry-push"
          config_path="$state_dir/production.config.json"
          mkdir -p "$state_dir"
          umask 077
          test -n "$PRODUCTION_CONFIG_JSON"
          printf '%s' "$PRODUCTION_CONFIG_JSON" > "$config_path"
          test "$(sha256sum "$config_path" | cut -d ' ' -f 1)" = "$EXPECTED_CONFIG_SHA256"
          (cd "$source_dir" && sha256sum --check --strict release.sha256)
          (cd "$image_dir" && sha256sum --check --strict image.sha256)
          test "$(az version --query '"azure-cli"' --output tsv)" = "2.88.0"
          docker info >/dev/null
          mkdir -p "$DOCKER_CONFIG"
          chmod 0700 "$DOCKER_CONFIG"
          docker load --input "$image_dir/candidate-image.tar" >/dev/null

          export SOURCE_DIR="$source_dir"
          export IMAGE_DIR="$image_dir"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          source_root = Path(os.environ["SOURCE_DIR"])
          image_root = Path(os.environ["IMAGE_DIR"])
          source = json.loads((source_root / "release-evidence.json").read_text(encoding="utf-8"))
          image = json.loads((image_root / "image-build-evidence.json").read_text(encoding="utf-8"))
          for key in (
              "runId", "runAttempt", "commitSha", "configSha256",
              "bicepSha256", "templateSha256", "imageId",
              "azureTarget", "federatedClientIds",
          ):
              if image.get(key) != source.get(key):
                  raise SystemExit(f"Image artifact is not bound to release field {key}.")
          if source["commitSha"] != os.environ["EXPECTED_SHA"]:
              raise SystemExit("Image commit does not match this workflow.")
          if source["configSha256"] != os.environ["EXPECTED_CONFIG_SHA256"]:
              raise SystemExit("Image configuration does not match this workflow.")
          if source.get("azureTarget") != {
              "tenantId": os.environ["DELIVERY_AZURE_TENANT_ID"].lower(),
              "subscriptionId": os.environ["DELIVERY_AZURE_SUBSCRIPTION_ID"].lower(),
          }:
              raise SystemExit("Image evidence Azure target changed.")
          if source.get("federatedClientIds") != {
              "whatIf": os.environ["DELIVERY_WHAT_IF_CLIENT_ID"].lower(),
              "registryPush": os.environ["DELIVERY_REGISTRY_PUSH_CLIENT_ID"].lower(),
              "infrastructureDeployment": os.environ[
                  "DELIVERY_INFRA_DEPLOY_CLIENT_ID"
              ].lower(),
              "migrationRuntime": os.environ[
                  "DELIVERY_MIGRATION_RUNTIME_CLIENT_ID"
              ].lower(),
          }:
              raise SystemExit("Image evidence federated identities changed.")
          if hashlib.sha256((image_root / "candidate-image.tar").read_bytes()).hexdigest() != image["imageTarSha256"]:
              raise SystemExit("Image archive digest does not match image evidence.")
          PY
          local_image_id="$(
            docker image inspect --format '{{.Id}}' \
              "agent-ready-fullstack-on-azure-starter-candidate:${GITHUB_SHA}"
          )"
          expected_image_id="$(
            python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["imageId"])' \
              "$source_dir/release-evidence.json"
          )"
          test "$local_image_id" = "$expected_image_id"
          echo "SOURCE_DIR=$source_dir" >> "$GITHUB_ENV"
          echo "IMAGE_DIR=$image_dir" >> "$GITHUB_ENV"
          echo "CONFIG_PATH=$config_path" >> "$GITHUB_ENV"
          echo "LOCAL_IMAGE_ID=$local_image_id" >> "$GITHUB_ENV"

      - name: Log in with the registry push federated identity
        uses: Azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_REGISTRY_PUSH_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: false

      - name: Push and prove the immutable ACR digest
        shell: bash
        run: |
          set -euo pipefail
          config="$CONFIG_PATH"
          account_path="$(dirname "$CONFIG_PATH")/account.json"
          az account show --output json > "$account_path"
          SOURCE_EVIDENCE="$SOURCE_DIR/release-evidence.json" \
            ACCOUNT_PATH="$account_path" EXPECTED_PURPOSE="registryPush" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = json.loads(
              Path(os.environ["SOURCE_EVIDENCE"]).read_text(encoding="utf-8")
          )
          account = json.loads(Path(os.environ["ACCOUNT_PATH"]).read_text(encoding="utf-8"))
          target = evidence["azureTarget"]
          identities = evidence["federatedClientIds"]
          if (
              target
              != {
                  "tenantId": os.environ["DELIVERY_AZURE_TENANT_ID"].lower(),
                  "subscriptionId": os.environ[
                      "DELIVERY_AZURE_SUBSCRIPTION_ID"
                  ].lower(),
              }
              or identities
              != {
                  "whatIf": os.environ["DELIVERY_WHAT_IF_CLIENT_ID"].lower(),
                  "registryPush": os.environ[
                      "DELIVERY_REGISTRY_PUSH_CLIENT_ID"
                  ].lower(),
                  "infrastructureDeployment": os.environ[
                      "DELIVERY_INFRA_DEPLOY_CLIENT_ID"
                  ].lower(),
                  "migrationRuntime": os.environ[
                      "DELIVERY_MIGRATION_RUNTIME_CLIENT_ID"
                  ].lower(),
              }
          ):
              raise SystemExit("Registry target variables changed after review.")
          if (
              str(account.get("tenantId", "")).lower() != target["tenantId"]
              or str(account.get("id", "")).lower() != target["subscriptionId"]
              or str(account.get("user", {}).get("type", "")).lower()
              != "serviceprincipal"
              or str(account.get("user", {}).get("name", "")).lower()
              != identities[os.environ["EXPECTED_PURPOSE"]]
          ):
              raise SystemExit("The authenticated registry identity is not reviewed.")
          PY
          readarray -t values < <(
            python3 - "$config" <<'PY'
          import json
          import sys

          config = json.load(open(sys.argv[1], encoding="utf-8"))
          print(config["names"]["resourceGroup"])
          print(config["names"]["containerRegistry"])
          print(config["image"]["repository"])
          print(config["image"]["tag"])
          PY
          )
          resource_group="${values[0]}"
          registry_name="${values[1]}"
          repository="${values[2]}"
          tag="${values[3]}"
          test "$tag" = "$GITHUB_SHA"
          [[ "$repository" =~ ^[a-z0-9]+([._/-][a-z0-9]+)*$ ]] || {
            echo "::error::The image repository is not a safe lowercase OCI path."
            exit 1
          }

          registry_uri="https://management.azure.com/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${resource_group}/providers/Microsoft.ContainerRegistry/registries/${registry_name}?api-version=2025-11-01"
          login_server="$(
            az rest --method get --uri "$registry_uri" --query properties.loginServer --output tsv
          )"
          [[ "$login_server" =~ ^[a-z0-9][a-z0-9-]*\.azurecr\.io$ ]] || {
            echo "::error::Azure returned an invalid ACR login server."
            exit 1
          }
          export LOGIN_SERVER="$login_server"
          echo "LOGIN_SERVER=$login_server" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import ipaddress
          import os
          import socket

          records = socket.getaddrinfo(os.environ["LOGIN_SERVER"], 443, type=socket.SOCK_STREAM)
          addresses = {ipaddress.ip_address(record[4][0].split("%", 1)[0]) for record in records}
          if not addresses or any(not address.is_private for address in addresses):
              raise SystemExit("ACR must resolve only to private addresses from the protected runner.")
          PY

          az acr login --name "$registry_name" --only-show-errors
          image_reference="${login_server}/${repository}:${tag}"
          pull_error="$IMAGE_DIR/existing-tag.error"
          metadata_path="$IMAGE_DIR/commit-tag-metadata.json"
          staging_reference=""
          staging_image=""
          remote_digest=""
          lock_and_verify_staging_tag() {
            local tag_metadata="$IMAGE_DIR/staging-residual-tag.json"
            local manifest_metadata="$IMAGE_DIR/staging-residual-manifest.json"
            local cleanup_digest

            az acr repository show \
              --name "$registry_name" \
              --image "$staging_image" \
              --only-show-errors \
              --output json > "$tag_metadata" || return 1
            cleanup_digest="$(
              python3 -c 'import json,re,sys; value=str(json.load(open(sys.argv[1], encoding="utf-8")).get("digest", "")); assert re.fullmatch(r"sha256:[0-9a-f]{64}", value); print(value)' \
                "$tag_metadata"
            )" || return 1
            if [[ -n "$remote_digest" && "$cleanup_digest" != "$remote_digest" ]]; then
              echo "::error::The residual ACR staging tag changed digest before cleanup." >&2
              return 1
            fi
            az acr repository update \
              --name "$registry_name" \
              --image "$staging_image" \
              --write-enabled false \
              --delete-enabled false \
              --only-show-errors \
              --output none || return 1
            az acr repository update \
              --name "$registry_name" \
              --image "${repository}@${cleanup_digest}" \
              --write-enabled false \
              --delete-enabled false \
              --only-show-errors \
              --output none || return 1
            az acr repository show \
              --name "$registry_name" \
              --image "$staging_image" \
              --only-show-errors \
              --output json > "$tag_metadata" || return 1
            az acr repository show \
              --name "$registry_name" \
              --image "${repository}@${cleanup_digest}" \
              --only-show-errors \
              --output json > "$manifest_metadata" || return 1
            EXPECTED_DIGEST="$cleanup_digest" python3 - \
              "$tag_metadata" "$manifest_metadata" <<'PY'
          import json
          import os
          import sys

          for path in sys.argv[1:]:
              metadata = json.load(open(path, encoding="utf-8"))
              attributes = metadata.get("changeableAttributes", {})
              if (
                  metadata.get("digest") != os.environ["EXPECTED_DIGEST"]
                  or attributes.get("writeEnabled") is not False
                  or attributes.get("deleteEnabled") is not False
              ):
                  raise SystemExit(
                      "The residual ACR staging tag or manifest is not immutable."
                  )
          PY
          }
          cleanup_staging_tag() {
            local original_status=$?
            trap - EXIT
            if [[ -n "$staging_image" ]] && ! az acr repository untag \
                --name "$registry_name" \
                --image "$staging_image" \
                --only-show-errors \
                --output none
            then
              echo "::warning::ACR staging untag failed; locking and verifying the residual alias."
              if ! lock_and_verify_staging_tag; then
                echo "::error::ACR staging cleanup failed and the residual alias was not proven immutable."
                return 1
              fi
            fi
            staging_image=""
            return "$original_status"
          }
          trap cleanup_staging_tag EXIT

          if docker pull "$image_reference" >/dev/null 2> "$pull_error"; then
            existing_image_id="$(docker image inspect "$image_reference" --format '{{.Id}}')"
            test "$existing_image_id" = "$LOCAL_IMAGE_ID" || {
              echo "::error::The reviewed commit tag already points to different content; refusing to overwrite it."
              exit 1
            }
            az acr repository show \
              --name "$registry_name" \
              --image "${repository}:${tag}" \
              --only-show-errors \
              --output json > "$metadata_path"
            remote_digest="$(
              python3 - "$metadata_path" <<'PY'
          import json
          import re
          import sys

          digest = str(json.load(open(sys.argv[1], encoding="utf-8")).get("digest", ""))
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit("Existing ACR commit tag has an invalid manifest digest.")
          print(digest)
          PY
            )"
            echo "::notice::The reviewed commit tag already contains the reviewed image; locking and reusing it without a push."
          else
            if ! grep -Eiq 'manifest unknown|manifest[^[:cntrl:]]*not found' "$pull_error"; then
              cat "$pull_error" >&2
              echo "::error::ACR tag existence could not be determined; refusing publication."
              exit 1
            fi

            staging_tag="staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(python3 -c 'import secrets; print(secrets.token_hex(16))')"
            staging_reference="${login_server}/${repository}:${staging_tag}"
            staging_image="${repository}:${staging_tag}"
            staging_metadata="$IMAGE_DIR/staging-tag-metadata.json"
            docker tag \
              "agent-ready-fullstack-on-azure-starter-candidate:${GITHUB_SHA}" \
              "$staging_reference"
            docker push "$staging_reference"
            az acr repository show \
              --name "$registry_name" \
              --image "${repository}:${staging_tag}" \
              --only-show-errors \
              --output json > "$staging_metadata"
            remote_digest="$(
              python3 - "$staging_metadata" <<'PY'
          import json
          import re
          import sys

          digest = str(json.load(open(sys.argv[1], encoding="utf-8")).get("digest", ""))
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit("ACR staging publication has an invalid manifest digest.")
          print(digest)
          PY
            )"

            digest_reference="${login_server}/${repository}@${remote_digest}"
            docker pull "$digest_reference" >/dev/null
            pulled_image_id="$(docker image inspect "$digest_reference" --format '{{.Id}}')"
            test "$pulled_image_id" = "$LOCAL_IMAGE_ID" || {
              echo "::error::The ACR staging digest does not resolve to the reviewed image."
              exit 1
            }

            import_error="$IMAGE_DIR/commit-tag-import.error"
            if ! az acr import \
              --name "$registry_name" \
              --source "$digest_reference" \
              --image "${repository}:${tag}" \
              --only-show-errors \
              --output none 2> "$import_error"
            then
              # A concurrent no-force publisher may have won. Accept only the same digest.
              if ! az acr repository show \
                --name "$registry_name" \
                --image "${repository}:${tag}" \
                --only-show-errors \
                --output json > "$metadata_path"
              then
                cat "$import_error" >&2
                echo "::error::Atomic ACR commit-tag publication failed."
                exit 1
              fi
              EXPECTED_DIGEST="$remote_digest" python3 - "$metadata_path" <<'PY'
          import json
          import os
          import sys

          actual = str(json.load(open(sys.argv[1], encoding="utf-8")).get("digest", ""))
          if actual != os.environ["EXPECTED_DIGEST"]:
              raise SystemExit(
                  "A concurrent publisher claimed the commit tag with different content."
              )
          PY
            fi
            rm -f "$import_error"
          fi
          rm -f "$pull_error"

          az acr repository update \
            --name "$registry_name" \
            --image "${repository}:${tag}" \
            --write-enabled false \
            --delete-enabled false \
            --only-show-errors \
            --output none
          az acr repository update \
            --name "$registry_name" \
            --image "${repository}@${remote_digest}" \
            --write-enabled false \
            --delete-enabled false \
            --only-show-errors \
            --output none
          az acr repository show \
            --name "$registry_name" \
            --image "${repository}:${tag}" \
            --only-show-errors \
            --output json > "$metadata_path"
          manifest_metadata_path="$IMAGE_DIR/manifest-metadata.json"
          az acr repository show \
            --name "$registry_name" \
            --image "${repository}@${remote_digest}" \
            --only-show-errors \
            --output json > "$manifest_metadata_path"
          EXPECTED_DIGEST="$remote_digest" python3 - \
            "$metadata_path" "$manifest_metadata_path" <<'PY'
          import json
          import os
          import sys

          for kind, path in (("commit tag", sys.argv[1]), ("manifest", sys.argv[2])):
              metadata = json.load(open(path, encoding="utf-8"))
              attributes = metadata.get("changeableAttributes", {})
              if metadata.get("digest") != os.environ["EXPECTED_DIGEST"]:
                  raise SystemExit(
                      f"The locked ACR {kind} does not reference the reviewed digest."
                  )
              if (
                  attributes.get("writeEnabled") is not False
                  or attributes.get("deleteEnabled") is not False
              ):
                  raise SystemExit(f"The ACR {kind} is not write/delete locked.")
          PY

          digest_reference="${login_server}/${repository}@${remote_digest}"
          docker pull "$digest_reference" >/dev/null
          pulled_image_id="$(docker image inspect "$digest_reference" --format '{{.Id}}')"
          test "$pulled_image_id" = "$LOCAL_IMAGE_ID" || {
            echo "::error::The immutable ACR digest does not resolve to the reviewed image."
            exit 1
          }
          if [[ -n "$staging_reference" ]]; then
            if ! az acr repository untag \
              --name "$registry_name" \
              --image "$staging_image" \
              --only-show-errors \
              --output none
            then
              echo "::warning::ACR staging untag failed; locking and verifying the residual alias."
              lock_and_verify_staging_tag || {
                echo "::error::The temporary ACR staging tag could not be removed or proven immutable."
                exit 1
              }
            fi
            staging_image=""
          fi
          trap - EXIT
          echo "REMOTE_IMAGE_REFERENCE=$image_reference" >> "$GITHUB_ENV"
          echo "DIGEST_IMAGE_REFERENCE=$digest_reference" >> "$GITHUB_ENV"
          echo "STAGING_IMAGE_REFERENCE=$staging_reference" >> "$GITHUB_ENV"

          evidence_dir="delivery-artifacts/image-evidence"
          mkdir -p "$evidence_dir"
          export EVIDENCE_DIR="$evidence_dir"
          export REGISTRY_LOGIN_SERVER="$login_server"
          export IMAGE_REPOSITORY="$repository"
          export IMAGE_DIGEST="$remote_digest"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          release = json.loads(
              (Path(os.environ["SOURCE_DIR"]) / "release-evidence.json").read_text(encoding="utf-8")
          )
          evidence = {
              **release,
              "registryLoginServer": os.environ["REGISTRY_LOGIN_SERVER"],
              "repository": os.environ["IMAGE_REPOSITORY"],
              "imageDigest": os.environ["IMAGE_DIGEST"],
              "imageReference": (
                  f'{os.environ["REGISTRY_LOGIN_SERVER"]}/'
                  f'{os.environ["IMAGE_REPOSITORY"]}@{os.environ["IMAGE_DIGEST"]}'
              ),
              "identityPurpose": "registry-push",
          }
          root = Path(os.environ["EVIDENCE_DIR"])
          root.joinpath("image-evidence.json").write_text(
              json.dumps(evidence, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          (
            cd "$evidence_dir"
            sha256sum image-evidence.json > image-evidence.sha256
          )

      - name: Upload verified ACR digest evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-image-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: delivery-artifacts/image-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Clear Azure, registry, image, and protected material
        if: always()
        shell: bash
        run: |
          if [[ -n "${LOGIN_SERVER:-}" ]]; then
            docker logout "$LOGIN_SERVER" >/dev/null 2>&1 || true
          fi
          az logout >/dev/null 2>&1 || true
          az account clear >/dev/null 2>&1 || true
          image_references=("agent-ready-fullstack-on-azure-starter-candidate:${GITHUB_SHA}")
          if [[ -n "${REMOTE_IMAGE_REFERENCE:-}" ]]; then
            image_references+=("$REMOTE_IMAGE_REFERENCE")
          fi
          if [[ -n "${DIGEST_IMAGE_REFERENCE:-}" ]]; then
            image_references+=("$DIGEST_IMAGE_REFERENCE")
          fi
          if [[ -n "${STAGING_IMAGE_REFERENCE:-}" ]]; then
            image_references+=("$STAGING_IMAGE_REFERENCE")
          fi
          docker image rm "${image_references[@]}" >/dev/null 2>&1 || true
          rm -rf delivery-artifacts "$DOCKER_CONFIG" "$AZURE_CONFIG_DIR"

  plan-migration:
    name: OIDC what-if identity (migration job)
    needs: push-image
    runs-on:
      group: production-vnet-runners
      labels:
        - self-hosted
        - linux
        - x64
        - vnet-connected
        - production
        - azure-cli-2-88-0
    timeout-minutes: 35
    environment: production
    permissions:
      id-token: write
    env:
      AZURE_CONFIG_DIR: ${{ github.workspace }}/.azure-migration-plan

    steps:
      - name: Reset runner-local delivery state
        shell: bash
        run: rm -rf -- delivery-artifacts "$AZURE_CONFIG_DIR"

      - name: Download source and verified image evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern:
            production-{release-source,image-evidence}-${{ github.run_id }}-${{ github.run_attempt
            }}
          path: delivery-artifacts
          merge-multiple: false

      - name: Verify digest-bound evidence and prepare migration parameters
        shell: bash
        env:
          EXPECTED_CONFIG_SHA256: ${{ inputs.config_sha256 }}
          EXPECTED_SHA: ${{ github.sha }}
          PRODUCTION_CONFIG_JSON: ${{ secrets.PRODUCTION_CONFIG_JSON }}
        run: |
          set -euo pipefail
          source_dir="delivery-artifacts/production-release-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image_dir="delivery-artifacts/production-image-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          state_dir="delivery-artifacts/private-migration-plan"
          config_path="$state_dir/production.config.json"
          parameters_path="$state_dir/migration.parameters.json"
          mkdir -p "$state_dir"
          umask 077
          test -n "$PRODUCTION_CONFIG_JSON"
          printf '%s' "$PRODUCTION_CONFIG_JSON" > "$config_path"
          test "$(sha256sum "$config_path" | cut -d ' ' -f 1)" = "$EXPECTED_CONFIG_SHA256"
          (cd "$source_dir" && sha256sum --check --strict release.sha256)
          (cd "$image_dir" && sha256sum --check --strict image-evidence.sha256)
          test "$(az version --query '"azure-cli"' --output tsv)" = "2.88.0"
          export SOURCE_DIR="$source_dir"
          export IMAGE_DIR="$image_dir"
          export CONFIG_PATH="$config_path"
          export PARAMETERS_PATH="$parameters_path"
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          source_root = Path(os.environ["SOURCE_DIR"])
          release = json.loads((source_root / "release-evidence.json").read_text(encoding="utf-8"))
          image = json.loads(
              (Path(os.environ["IMAGE_DIR"]) / "image-evidence.json").read_text(encoding="utf-8")
          )
          for key in (
              "runId", "runAttempt", "commitSha", "configSha256",
              "bicepSha256", "templateSha256", "imageId",
              "azureTarget", "federatedClientIds",
          ):
              if image.get(key) != release.get(key):
                  raise SystemExit(f"Registry evidence is not bound to release field {key}.")
          if release["commitSha"] != os.environ["EXPECTED_SHA"]:
              raise SystemExit("Release commit does not match this workflow.")
          if release["configSha256"] != os.environ["EXPECTED_CONFIG_SHA256"]:
              raise SystemExit("Release configuration does not match this workflow.")
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", image.get("imageDigest", "")):
              raise SystemExit("Registry evidence has an invalid image digest.")

          if release.get("azureTarget") != {
              "tenantId": os.environ["DELIVERY_AZURE_TENANT_ID"].lower(),
              "subscriptionId": os.environ["DELIVERY_AZURE_SUBSCRIPTION_ID"].lower(),
          } or release.get("federatedClientIds") != {
              "whatIf": os.environ["DELIVERY_WHAT_IF_CLIENT_ID"].lower(),
              "registryPush": os.environ["DELIVERY_REGISTRY_PUSH_CLIENT_ID"].lower(),
              "infrastructureDeployment": os.environ[
                  "DELIVERY_INFRA_DEPLOY_CLIENT_ID"
              ].lower(),
              "migrationRuntime": os.environ[
                  "DELIVERY_MIGRATION_RUNTIME_CLIENT_ID"
              ].lower(),
          }:
              raise SystemExit("Migration plan target identities changed.")
          config = json.loads(Path(os.environ["CONFIG_PATH"]).read_text(encoding="utf-8"))
          expected_login_server = f'{config["names"]["containerRegistry"]}.azurecr.io'
          expected_reference = (
              f'{expected_login_server}/{config["image"]["repository"]}@{image["imageDigest"]}'
          )
          if (
              image.get("identityPurpose") != "registry-push"
              or image.get("registryLoginServer") != expected_login_server
              or image.get("repository") != config["image"]["repository"]
              or image.get("imageReference") != expected_reference
          ):
              raise SystemExit("Registry evidence is not bound to the reviewed ACR repository.")
          parameters = {
              "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
              "contentVersion": "1.0.0.0",
              "parameters": {
                  "config": {"value": config},
                  "enableFoundry": {"value": False},
                  "deploymentStage": {"value": "migration"},
                  "imageDigest": {"value": image["imageDigest"]},
                  "previousRevisionName": {"value": ""},
                  "webRevisionSuffix": {"value": ""},
              },
          }
          Path(os.environ["PARAMETERS_PATH"]).write_text(
              json.dumps(parameters, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          echo "SOURCE_DIR=$source_dir" >> "$GITHUB_ENV"
          echo "IMAGE_DIR=$image_dir" >> "$GITHUB_ENV"
          echo "CONFIG_PATH=$config_path" >> "$GITHUB_ENV"
          echo "PARAMETERS_PATH=$parameters_path" >> "$GITHUB_ENV"

      - name: Log in with the what-if federated identity
        uses: Azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_WHAT_IF_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: false

      - name: Produce digest-bound migration what-if
        shell: bash
        run: |
          set -euo pipefail
          plan_dir="delivery-artifacts/migration-plan"
          mkdir -p "$plan_dir"
          location="$(
            python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["primaryLocation"])' \
              "$CONFIG_PATH"
          )"
          account_path="$(dirname "$CONFIG_PATH")/account.json"
          az account show --output json > "$account_path"
          SOURCE_EVIDENCE="$SOURCE_DIR/release-evidence.json" \
            ACCOUNT_PATH="$account_path" EXPECTED_PURPOSE="whatIf" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = json.loads(
              Path(os.environ["SOURCE_EVIDENCE"]).read_text(encoding="utf-8")
          )
          account = json.loads(Path(os.environ["ACCOUNT_PATH"]).read_text(encoding="utf-8"))
          target = evidence["azureTarget"]
          identities = evidence["federatedClientIds"]
          if target != {
              "tenantId": os.environ["DELIVERY_AZURE_TENANT_ID"].lower(),
              "subscriptionId": os.environ["DELIVERY_AZURE_SUBSCRIPTION_ID"].lower(),
          } or identities != {
              "whatIf": os.environ["DELIVERY_WHAT_IF_CLIENT_ID"].lower(),
              "registryPush": os.environ["DELIVERY_REGISTRY_PUSH_CLIENT_ID"].lower(),
              "infrastructureDeployment": os.environ[
                  "DELIVERY_INFRA_DEPLOY_CLIENT_ID"
              ].lower(),
              "migrationRuntime": os.environ[
                  "DELIVERY_MIGRATION_RUNTIME_CLIENT_ID"
              ].lower(),
          }:
              raise SystemExit("Migration target variables changed after release review.")
          if (
              str(account.get("tenantId", "")).lower() != target["tenantId"]
              or str(account.get("id", "")).lower() != target["subscriptionId"]
              or str(account.get("user", {}).get("type", "")).lower()
              != "serviceprincipal"
              or str(account.get("user", {}).get("name", "")).lower()
              != identities[os.environ["EXPECTED_PURPOSE"]]
          ):
              raise SystemExit("The authenticated migration what-if identity is not reviewed.")
          PY
          az deployment sub what-if \
            --name "migration-infra-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --location "$location" \
            --template-file "$SOURCE_DIR/main.json" \
            --parameters "@$PARAMETERS_PATH" \
            --result-format FullResourcePayloads \
            --no-pretty-print \
            --only-show-errors \
            --output json > "$(dirname "$CONFIG_PATH")/migration.what-if.raw.json"

          export PLAN_DIR="$plan_dir"
          export RAW_WHAT_IF_PATH="$(dirname "$CONFIG_PATH")/migration.what-if.raw.json"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          source = Path(os.environ["SOURCE_DIR"])
          image_root = Path(os.environ["IMAGE_DIR"])
          plan = Path(os.environ["PLAN_DIR"])
          release = json.loads((source / "release-evidence.json").read_text(encoding="utf-8"))
          image = json.loads((image_root / "image-evidence.json").read_text(encoding="utf-8"))
          raw_path = Path(os.environ["RAW_WHAT_IF_PATH"])
          result = json.loads(raw_path.read_text(encoding="utf-8"))
          changes = result.get("properties", {}).get("changes")
          if not isinstance(changes, list):
              raise SystemExit("Migration what-if returned an invalid result.")

          allowed_types = {"Create", "Deploy", "Modify", "NoChange"}
          rejected_types = {"Delete", "Ignore", "Unsupported"}
          rejected = sorted(
              {
                  str(change.get("changeType", ""))
                  for change in changes
                  if change.get("changeType") not in allowed_types
              }
          )
          if rejected:
              raise SystemExit(
                  f"Migration what-if contains rejected change types: {rejected}."
              )
          config = json.loads(Path(os.environ["CONFIG_PATH"]).read_text(encoding="utf-8"))
          web_resource = (
              f'/containerapps/{config["names"]["webContainerApp"]}'.lower()
          )

          def enforce_policy(value, path=""):
              if isinstance(value, dict):
                  if (
                      str(value.get("action", "")).lower() == "allow"
                      and str(value.get("ipAddressRange", "")) == "0.0.0.0/0"
                  ):
                      raise SystemExit(f"Unsafe allow-all network rule at {path}.")
                  for key, child in value.items():
                      child_path = f"{path}.{key}" if path else key
                      lowered = key.lower()
                      if (
                          lowered.startswith("publicnetworkaccess")
                          and child != "Disabled"
                      ):
                          raise SystemExit(
                              f"Public data-plane access is not disabled at {child_path}."
                          )
                      if lowered == "allowinsecure" and child is True:
                          raise SystemExit(f"Insecure ingress is enabled at {child_path}.")
                      if (
                          lowered == "unauthenticatedclientaction"
                          and child == "AllowAnonymous"
                      ):
                          raise SystemExit(
                              f"Anonymous application access is enabled at {child_path}."
                          )
                      enforce_policy(child, child_path)
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      enforce_policy(child, f"{path}[{index}]")

          for change in changes:
              resource_id = str(change.get("resourceId", "")).lower()
              if web_resource in resource_id:
                  raise SystemExit("Migration stage may not modify the web application.")
              enforce_policy(change.get("after"), resource_id)

          sensitive = re.compile(
              r"(secret|password|token|credential|connectionstring|privatekey|certificate)",
              re.I,
          )
          visible = re.compile(
              r"(name|type|location|kind|sku|tier|capacity|zones|version|publicnetworkaccess|"
              r"external|ipsecurityrestrictions|ipaddressrange|action|traffic|route|dns|"
              r"fqdn|host|domain|address|subnet|groupids|principal|roledefinition|identity|"
              r"audience|issuer|transport|targetport|image|command|args|replica|scale|tls)",
              re.I,
          )
          subscription_id = release["azureTarget"]["subscriptionId"]

          def canonical(value):
              if isinstance(value, dict):
                  return {key: canonical(value[key]) for key in sorted(value)}
              if isinstance(value, list):
                  items = [canonical(item) for item in value]
                  if items and all(isinstance(item, dict) for item in items):
                      if all("resourceId" in item for item in items):
                          items.sort(key=lambda item: str(item["resourceId"]).lower())
                      elif all("path" in item for item in items):
                          items.sort(key=lambda item: str(item["path"]))
                  return items
              return value

          def digest(value):
              payload = json.dumps(
                  canonical(value), sort_keys=True, separators=(",", ":")
              ).encode()
              return hashlib.sha256(payload).hexdigest()

          def safe_value(path, value):
              if value is None or isinstance(value, (bool, int, float)):
                  return value
              if sensitive.search(path):
                  return {"redacted": True, "type": type(value).__name__}
              if isinstance(value, str) and visible.search(path):
                  return value.replace(subscription_id, "<subscription>")
              return {"sha256": digest(value), "redacted": True}

          def flatten(value, path=""):
              rows = []
              if isinstance(value, dict):
                  for key in sorted(value):
                      rows.extend(
                          flatten(value[key], f"{path}.{key}" if path else key)
                      )
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      rows.extend(flatten(child, f"{path}[{index}]"))
              else:
                  rows.append(
                      {
                          "path": path,
                          "propertyChangeType": "Create",
                          "after": safe_value(path, value),
                      }
                  )
              return rows

          def flatten_delta(entries):
              rows = []
              for entry in entries or []:
                  path = str(entry.get("path", ""))
                  if entry.get("children"):
                      rows.extend(flatten_delta(entry["children"]))
                  else:
                      row = {
                          "path": path,
                          "propertyChangeType": entry.get(
                              "propertyChangeType", "Modify"
                          ),
                      }
                      if "before" in entry:
                          row["before"] = safe_value(path, entry.get("before"))
                      if "after" in entry:
                          row["after"] = safe_value(path, entry.get("after"))
                      rows.append(row)
              return sorted(rows, key=lambda row: row["path"])

          review_changes = []
          for change in sorted(
              changes, key=lambda item: str(item.get("resourceId", "")).lower()
          ):
              change_type = str(change.get("changeType", ""))
              properties = (
                  flatten(change.get("after"))
                  if change_type == "Create"
                  else flatten_delta(change.get("delta", []))
              )
              if change_type == "Modify" and not properties:
                  properties = flatten(change.get("after"))
              review_changes.append(
                  {
                      "resourceId": str(change.get("resourceId", "")).replace(
                          subscription_id, "<subscription>"
                      ),
                      "changeType": change_type,
                      "propertyChanges": properties,
                  }
              )

          review = {
              "schemaVersion": 1,
              "policyVersion": "azure-what-if-v1",
              "stage": "migration",
              "allowedChangeTypes": sorted(allowed_types),
              "rejectedChangeTypes": sorted(rejected_types),
              "changeSummary": {
                  change_type: sum(
                      1
                      for change in changes
                      if change.get("changeType") == change_type
                  )
                  for change_type in sorted(
                      {str(change.get("changeType", "")) for change in changes}
                  )
              },
              "changes": review_changes,
          }
          review_path = plan / "migration.what-if.review.json"
          review_path.write_text(
              json.dumps(review, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          raw_canonical = json.dumps(
              canonical(result), sort_keys=True, separators=(",", ":")
          ).encode()
          evidence = {
              **release,
              "imageDigest": image["imageDigest"],
              "imageReference": image["imageReference"],
              "stage": "migration",
              "identityPurpose": "what-if",
              "parametersSha256": hashlib.sha256(
                  Path(os.environ["PARAMETERS_PATH"]).read_bytes()
              ).hexdigest(),
              "whatIfStateSha256": hashlib.sha256(raw_canonical).hexdigest(),
              "whatIfReviewSha256": hashlib.sha256(
                  review_path.read_bytes()
              ).hexdigest(),
              "whatIfPolicyVersion": "azure-what-if-v1",
          }
          plan.joinpath("migration-plan-evidence.json").write_text(
              json.dumps(evidence, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          (
            cd "$plan_dir"
            sha256sum \
              migration.what-if.review.json \
              migration-plan-evidence.json > migration-plan.sha256
          )

      - name: Upload migration what-if for protected review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-migration-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: delivery-artifacts/migration-plan
          if-no-files-found: error
          retention-days: 30

      - name: Clear Azure session and protected files
        if: always()
        shell: bash
        run: |
          az logout >/dev/null 2>&1 || true
          az account clear >/dev/null 2>&1 || true
          rm -rf delivery-artifacts "$AZURE_CONFIG_DIR"

  deploy-migration-infrastructure:
    name: Protected gate and infrastructure identity (migration job)
    needs: plan-migration
    runs-on:
      group: production-vnet-runners
      labels:
        - self-hosted
        - linux
        - x64
        - vnet-connected
        - production
        - azure-cli-2-88-0
    timeout-minutes: 60
    environment: production
    permissions:
      id-token: write
    env:
      AZURE_CONFIG_DIR: ${{ github.workspace }}/.azure-migration-deploy

    steps:
      - name: Reset runner-local delivery state
        shell: bash
        run: rm -rf -- delivery-artifacts "$AZURE_CONFIG_DIR"

      - name: Download source, image, and reviewed migration plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern:
            production-{release-source,image-evidence,migration-plan}-${{ github.run_id }}-${{
            github.run_attempt }}
          path: delivery-artifacts
          merge-multiple: false

      - name: Verify migration plan binding before OIDC
        shell: bash
        env:
          EXPECTED_CONFIG_SHA256: ${{ inputs.config_sha256 }}
          EXPECTED_SHA: ${{ github.sha }}
          PRODUCTION_CONFIG_JSON: ${{ secrets.PRODUCTION_CONFIG_JSON }}
        run: |
          set -euo pipefail
          source_dir="delivery-artifacts/production-release-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image_dir="delivery-artifacts/production-image-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          plan_dir="delivery-artifacts/production-migration-plan-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          state_dir="delivery-artifacts/private-migration-deploy"
          config_path="$state_dir/production.config.json"
          parameters_path="$state_dir/migration.parameters.json"
          mkdir -p "$state_dir"
          umask 077
          test -n "$PRODUCTION_CONFIG_JSON"
          printf '%s' "$PRODUCTION_CONFIG_JSON" > "$config_path"
          test "$(sha256sum "$config_path" | cut -d ' ' -f 1)" = "$EXPECTED_CONFIG_SHA256"
          (cd "$source_dir" && sha256sum --check --strict release.sha256)
          (cd "$image_dir" && sha256sum --check --strict image-evidence.sha256)
          (cd "$plan_dir" && sha256sum --check --strict migration-plan.sha256)
          test "$(az version --query '"azure-cli"' --output tsv)" = "2.88.0"
          export SOURCE_DIR="$source_dir"
          export IMAGE_DIR="$image_dir"
          export PLAN_DIR="$plan_dir"
          export CONFIG_PATH="$config_path"
          export PARAMETERS_PATH="$parameters_path"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          source_root = Path(os.environ["SOURCE_DIR"])
          source = json.loads((source_root / "release-evidence.json").read_text(encoding="utf-8"))
          image = json.loads(
              (Path(os.environ["IMAGE_DIR"]) / "image-evidence.json").read_text(encoding="utf-8")
          )
          plan_root = Path(os.environ["PLAN_DIR"])
          plan = json.loads((plan_root / "migration-plan-evidence.json").read_text(encoding="utf-8"))
          if hashlib.sha256((source_root / "main.json").read_bytes()).hexdigest() != source["templateSha256"]:
              raise SystemExit("Compiled template digest changed before migration deployment.")
          if hashlib.sha256(Path(os.environ["CONFIG_PATH"]).read_bytes()).hexdigest() != source["configSha256"]:
              raise SystemExit("Production configuration digest changed before migration deployment.")
          for key in (
              "runId", "runAttempt", "commitSha", "configSha256",
              "bicepSha256", "templateSha256", "imageId",
              "azureTarget", "federatedClientIds",
          ):
              if source.get(key) != image.get(key) or source.get(key) != plan.get(key):
                  raise SystemExit(f"Migration evidence mismatch for {key}.")
          if plan.get("imageDigest") != image.get("imageDigest"):
              raise SystemExit("Migration plan image digest does not match ACR evidence.")
          if source["commitSha"] != os.environ["EXPECTED_SHA"] or source["configSha256"] != os.environ["EXPECTED_CONFIG_SHA256"]:
              raise SystemExit("Migration evidence does not match this workflow.")
          if plan.get("stage") != "migration" or plan.get("identityPurpose") != "what-if":
              raise SystemExit("Migration plan stage or identity purpose is invalid.")
          if plan.get("whatIfPolicyVersion") != "azure-what-if-v1":
              raise SystemExit("Migration what-if policy version is invalid.")
          if hashlib.sha256((plan_root / "migration.what-if.review.json").read_bytes()).hexdigest() != plan["whatIfReviewSha256"]:
              raise SystemExit("Migration what-if changed after review.")
          if source.get("azureTarget") != {
              "tenantId": os.environ["DELIVERY_AZURE_TENANT_ID"].lower(),
              "subscriptionId": os.environ["DELIVERY_AZURE_SUBSCRIPTION_ID"].lower(),
          } or source.get("federatedClientIds") != {
              "whatIf": os.environ["DELIVERY_WHAT_IF_CLIENT_ID"].lower(),
              "registryPush": os.environ["DELIVERY_REGISTRY_PUSH_CLIENT_ID"].lower(),
              "infrastructureDeployment": os.environ[
                  "DELIVERY_INFRA_DEPLOY_CLIENT_ID"
              ].lower(),
              "migrationRuntime": os.environ[
                  "DELIVERY_MIGRATION_RUNTIME_CLIENT_ID"
              ].lower(),
          }:
              raise SystemExit("Migration deployment target identities changed.")
          config = json.loads(Path(os.environ["CONFIG_PATH"]).read_text(encoding="utf-8"))
          parameters = {
              "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
              "contentVersion": "1.0.0.0",
              "parameters": {
                  "config": {"value": config},
                  "enableFoundry": {"value": False},
                  "deploymentStage": {"value": "migration"},
                  "imageDigest": {"value": image["imageDigest"]},
                  "previousRevisionName": {"value": ""},
                  "webRevisionSuffix": {"value": ""},
              },
          }
          parameter_bytes = (
              json.dumps(parameters, sort_keys=True, separators=(",", ":")) + "\n"
          ).encode()
          if hashlib.sha256(parameter_bytes).hexdigest() != plan["parametersSha256"]:
              raise SystemExit("Re-materialized migration parameters differ from review.")
          Path(os.environ["PARAMETERS_PATH"]).write_bytes(parameter_bytes)
          PY
          echo "SOURCE_DIR=$source_dir" >> "$GITHUB_ENV"
          echo "PLAN_DIR=$plan_dir" >> "$GITHUB_ENV"
          echo "CONFIG_PATH=$config_path" >> "$GITHUB_ENV"
          echo "PARAMETERS_PATH=$parameters_path" >> "$GITHUB_ENV"

      - name: Log in with the infrastructure deployment federated identity
        uses: Azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_INFRA_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: false

      - name: Deploy only the digest-pinned migration job
        shell: bash
        run: |
          set -euo pipefail
          location="$(
            python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["primaryLocation"])' \
              "$CONFIG_PATH"
          )"
          account_path="$(dirname "$CONFIG_PATH")/account.json"
          az account show --output json > "$account_path"
          SOURCE_EVIDENCE="$SOURCE_DIR/release-evidence.json" \
            ACCOUNT_PATH="$account_path" EXPECTED_PURPOSE="infrastructureDeployment" \
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = json.loads(
              Path(os.environ["SOURCE_EVIDENCE"]).read_text(encoding="utf-8")
          )
          account = json.loads(Path(os.environ["ACCOUNT_PATH"]).read_text(encoding="utf-8"))
          target = evidence["azureTarget"]
          identities = evidence["federatedClientIds"]
          if target != {
              "tenantId": os.environ["DELIVERY_AZURE_TENANT_ID"].lower(),
              "subscriptionId": os.environ["DELIVERY_AZURE_SUBSCRIPTION_ID"].lower(),
          } or identities != {
              "whatIf": os.environ["DELIVERY_WHAT_IF_CLIENT_ID"].lower(),
              "registryPush": os.environ["DELIVERY_REGISTRY_PUSH_CLIENT_ID"].lower(),
              "infrastructureDeployment": os.environ[
                  "DELIVERY_INFRA_DEPLOY_CLIENT_ID"
              ].lower(),
              "migrationRuntime": os.environ[
                  "DELIVERY_MIGRATION_RUNTIME_CLIENT_ID"
              ].lower(),
          }:
              raise SystemExit("Migration deployment target variables changed.")
          if (
              str(account.get("tenantId", "")).lower() != target["tenantId"]
              or str(account.get("id", "")).lower() != target["subscriptionId"]
              or str(account.get("user", {}).get("type", "")).lower()
              != "serviceprincipal"
              or str(account.get("user", {}).get("name", "")).lower()
              != identities[os.environ["EXPECTED_PURPOSE"]]
          ):
              raise SystemExit("The authenticated migration deployment identity is not reviewed.")
          PY
          fresh_what_if="$(dirname "$CONFIG_PATH")/migration.what-if.fresh.json"
          az deployment sub what-if \
            --name "migration-infra-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --location "$location" \
            --template-file "$SOURCE_DIR/main.json" \
            --parameters "@$PARAMETERS_PATH" \
            --result-format FullResourcePayloads \
            --no-pretty-print \
            --only-show-errors \
            --output json > "$fresh_what_if"
          FRESH_WHAT_IF="$fresh_what_if" \
            PLAN_EVIDENCE="$PLAN_DIR/migration-plan-evidence.json" python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def canonical(value):
              if isinstance(value, dict):
                  return {key: canonical(value[key]) for key in sorted(value)}
              if isinstance(value, list):
                  items = [canonical(item) for item in value]
                  if items and all(isinstance(item, dict) for item in items):
                      if all("resourceId" in item for item in items):
                          items.sort(key=lambda item: str(item["resourceId"]).lower())
                      elif all("path" in item for item in items):
                          items.sort(key=lambda item: str(item["path"]))
                  return items
              return value

          result = json.loads(
              Path(os.environ["FRESH_WHAT_IF"]).read_text(encoding="utf-8")
          )
          changes = result.get("properties", {}).get("changes")
          if not isinstance(changes, list):
              raise SystemExit("Fresh migration what-if returned an invalid result.")
          allowed_types = {"Create", "Deploy", "Modify", "NoChange"}
          rejected = {
              str(change.get("changeType", ""))
              for change in changes
              if change.get("changeType") not in allowed_types
          }
          if rejected:
              raise SystemExit(f"Fresh migration what-if is unsafe: {sorted(rejected)}.")
          reviewed = json.loads(
              Path(os.environ["PLAN_EVIDENCE"]).read_text(encoding="utf-8")
          )
          payload = json.dumps(
              canonical(result), sort_keys=True, separators=(",", ":")
          ).encode()
          if hashlib.sha256(payload).hexdigest() != reviewed["whatIfStateSha256"]:
              raise SystemExit(
                  "Azure state changed after migration review; re-plan is required."
              )
          PY
          az deployment sub create \
            --name "migration-infra-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --location "$location" \
            --template-file "$SOURCE_DIR/main.json" \
            --parameters "@$PARAMETERS_PATH" \
            --only-show-errors \
            --output none

      - name: Clear Azure session and protected files
        if: always()
        shell: bash
        run: |
          az logout >/dev/null 2>&1 || true
          az account clear >/dev/null 2>&1 || true
          rm -rf delivery-artifacts "$AZURE_CONFIG_DIR"

  run-migrations:
    name: Migration/runtime federated identity (expand and migrate)
    needs: deploy-migration-infrastructure
    runs-on:
      group: production-vnet-runners
      labels:
        - self-hosted
        - linux
        - x64
        - vnet-connected
        - production
        - azure-cli-2-88-0
    timeout-minutes: 45
    environment: production
    permissions:
      id-token: write
    env:
      AZURE_CONFIG_DIR: ${{ github.workspace }}/.azure-migration-runtime

    steps:
      - name: Reset runner-local delivery state
        shell: bash
        run: rm -rf -- delivery-artifacts "$AZURE_CONFIG_DIR"

      - name: Download source and verified image evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern:
            production-{release-source,image-evidence}-${{ github.run_id }}-${{ github.run_attempt
            }}
          path: delivery-artifacts
          merge-multiple: false

      - name: Verify migration confirmation and digest evidence before OIDC
        shell: bash
        env:
          MIGRATION_CONFIRMATION: ${{ inputs.migration_confirmation }}
          EXPECTED_CONFIG_SHA256: ${{ inputs.config_sha256 }}
          EXPECTED_SHA: ${{ github.sha }}
          PRODUCTION_CONFIG_JSON: ${{ secrets.PRODUCTION_CONFIG_JSON }}
        run: |
          set -euo pipefail
          test "$MIGRATION_CONFIRMATION" = "RUN PRODUCTION MIGRATIONS"
          source_dir="delivery-artifacts/production-release-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image_dir="delivery-artifacts/production-image-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          state_dir="delivery-artifacts/private-migration-runtime"
          config_path="$state_dir/production.config.json"
          mkdir -p "$state_dir"
          umask 077
          test -n "$PRODUCTION_CONFIG_JSON"
          printf '%s' "$PRODUCTION_CONFIG_JSON" > "$config_path"
          test "$(sha256sum "$config_path" | cut -d ' ' -f 1)" = "$EXPECTED_CONFIG_SHA256"
          (cd "$source_dir" && sha256sum --check --strict release.sha256)
          (cd "$image_dir" && sha256sum --check --strict image-evidence.sha256)
          test "$(az version --query '"azure-cli"' --output tsv)" = "2.88.0"
          export SOURCE_DIR="$source_dir"
          export IMAGE_DIR="$image_dir"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          source = json.loads(
              (Path(os.environ["SOURCE_DIR"]) / "release-evidence.json").read_text(encoding="utf-8")
          )
          image = json.loads(
              (Path(os.environ["IMAGE_DIR"]) / "image-evidence.json").read_text(encoding="utf-8")
          )
          for key in (
              "runId", "runAttempt", "commitSha", "configSha256",
              "bicepSha256", "templateSha256", "imageId",
              "azureTarget", "federatedClientIds",
          ):
              if source.get(key) != image.get(key):
                  raise SystemExit(f"Migration runtime evidence mismatch for {key}.")
          if source["commitSha"] != os.environ["EXPECTED_SHA"] or source["configSha256"] != os.environ["EXPECTED_CONFIG_SHA256"]:
              raise SystemExit("Migration runtime evidence does not match this workflow.")
          if source.get("azureTarget") != {
              "tenantId": os.environ["DELIVERY_AZURE_TENANT_ID"].lower(),
              "subscriptionId": os.environ["DELIVERY_AZURE_SUBSCRIPTION_ID"].lower(),
          } or source.get("federatedClientIds") != {
              "whatIf": os.environ["DELIVERY_WHAT_IF_CLIENT_ID"].lower(),
              "registryPush": os.environ["DELIVERY_REGISTRY_PUSH_CLIENT_ID"].lower(),
              "infrastructureDeployment": os.environ[
                  "DELIVERY_INFRA_DEPLOY_CLIENT_ID"
              ].lower(),
              "migrationRuntime": os.environ[
                  "DELIVERY_MIGRATION_RUNTIME_CLIENT_ID"
              ].lower(),
          }:
              raise SystemExit("Migration runtime target identities changed.")
          PY
          echo "SOURCE_DIR=$source_dir" >> "$GITHUB_ENV"
          echo "IMAGE_DIR=$image_dir" >> "$GITHUB_ENV"
          echo "CONFIG_PATH=$config_path" >> "$GITHUB_ENV"

      - name: Log in with the migration/runtime federated identity
        uses: Azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_MIGRATION_RUNTIME_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: false

      - name: Start one digest-pinned migration execution and verify success
        shell: bash
        run: |
          set -euo pipefail
          config="$CONFIG_PATH"
          account_path="$(dirname "$CONFIG_PATH")/account.json"
          az account show --output json > "$account_path"
          SOURCE_EVIDENCE="$SOURCE_DIR/release-evidence.json" \
            ACCOUNT_PATH="$account_path" EXPECTED_PURPOSE="migrationRuntime" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = json.loads(
              Path(os.environ["SOURCE_EVIDENCE"]).read_text(encoding="utf-8")
          )
          account = json.loads(Path(os.environ["ACCOUNT_PATH"]).read_text(encoding="utf-8"))
          target = evidence["azureTarget"]
          identities = evidence["federatedClientIds"]
          if target != {
              "tenantId": os.environ["DELIVERY_AZURE_TENANT_ID"].lower(),
              "subscriptionId": os.environ["DELIVERY_AZURE_SUBSCRIPTION_ID"].lower(),
          } or identities != {
              "whatIf": os.environ["DELIVERY_WHAT_IF_CLIENT_ID"].lower(),
              "registryPush": os.environ["DELIVERY_REGISTRY_PUSH_CLIENT_ID"].lower(),
              "infrastructureDeployment": os.environ[
                  "DELIVERY_INFRA_DEPLOY_CLIENT_ID"
              ].lower(),
              "migrationRuntime": os.environ[
                  "DELIVERY_MIGRATION_RUNTIME_CLIENT_ID"
              ].lower(),
          }:
              raise SystemExit("Migration runtime target variables changed.")
          if (
              str(account.get("tenantId", "")).lower() != target["tenantId"]
              or str(account.get("id", "")).lower() != target["subscriptionId"]
              or str(account.get("user", {}).get("type", "")).lower()
              != "serviceprincipal"
              or str(account.get("user", {}).get("name", "")).lower()
              != identities[os.environ["EXPECTED_PURPOSE"]]
          ):
              raise SystemExit("The authenticated migration runtime identity is not reviewed.")
          PY
          readarray -t values < <(
            python3 - "$config" <<'PY'
          import json
          import sys

          config = json.load(open(sys.argv[1], encoding="utf-8"))
          print(config["names"]["resourceGroup"])
          print(config["names"]["migrationJob"])
          PY
          )
          resource_group="${values[0]}"
          migration_job="${values[1]}"
          expected_image="$(
            python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["imageReference"])' \
              "$IMAGE_DIR/image-evidence.json"
          )"
          job_uri="https://management.azure.com/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${resource_group}/providers/Microsoft.App/jobs/${migration_job}"
          az rest --method get --uri "${job_uri}?api-version=2026-01-01" \
            --output json > "$IMAGE_DIR/migration-job.json"
          EXPECTED_IMAGE="$expected_image" python3 - \
            "$IMAGE_DIR/migration-job.json" "$config" <<'PY'
          import json
          import os
          import re
          import sys

          job = json.load(open(sys.argv[1], encoding="utf-8"))
          config = json.load(open(sys.argv[2], encoding="utf-8"))
          containers = job.get("properties", {}).get("template", {}).get("containers", [])
          if len(containers) != 1 or containers[0].get("image") != os.environ["EXPECTED_IMAGE"]:
              raise SystemExit("Migration job does not use the reviewed ACR digest.")
          container = containers[0]
          if (
              container.get("command") != config["image"]["migrationCommand"]
              or container.get("args") != config["image"]["migrationArguments"]
          ):
              raise SystemExit("Migration job does not use the reviewed production entrypoint.")
          environment = {item.get("name"): item.get("value") for item in container.get("env", [])}
          expected_environment = {
              "NODE_ENV": "production",
              "RUNTIME_MODE": "production",
              "DATABASE_MODE": "azure-managed-identity",
              "DATABASE_HOST": f'{config["names"]["postgresServer"]}.postgres.database.azure.com',
              "DATABASE_PORT": "5432",
              "DATABASE_NAME": config["names"]["postgresDatabase"],
              "DATABASE_USER": config["postgres"]["migrationPrincipalName"],
              "AUTH_MODE": "container-apps",
              "LOGGING_MODE": "json",
              "TELEMETRY_MODE": "disabled",
          }
          if any(environment.get(key) != value for key, value in expected_environment.items()):
              raise SystemExit("Migration job environment does not match the reviewed runtime contract.")
          forbidden_environment = {
              "APPLICATIONINSIGHTS_CONNECTION_STRING",
              "DATABASE_PASSWORD",
              "OTEL_EXPORTER_OTLP_ENDPOINT",
          }
          if forbidden_environment.intersection(environment) or not re.fullmatch(
              r"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}",
              environment.get("AZURE_CLIENT_ID", ""),
              re.I,
          ):
              raise SystemExit("Migration job identity environment is invalid.")
          assigned = list(job.get("identity", {}).get("userAssignedIdentities", {}))
          expected_suffix = (
              f'/userAssignedIdentities/{config["names"]["migrationIdentity"]}'.lower()
          )
          if len(assigned) != 1 or not assigned[0].lower().endswith(expected_suffix):
              raise SystemExit("Migration job does not use the reviewed workload identity.")
          if job.get("properties", {}).get("configuration", {}).get("triggerType") != "Manual":
              raise SystemExit("Migration job must remain manually triggered.")
          PY

          az rest --method get --uri "${job_uri}/executions?api-version=2026-01-01" \
            --output json > "$IMAGE_DIR/executions-before.json"
          python3 - "$IMAGE_DIR/executions-before.json" <<'PY'
          import json
          import sys

          terminal = {"Succeeded", "Failed", "Stopped", "Degraded"}
          executions = json.load(open(sys.argv[1], encoding="utf-8")).get("value", [])
          nonterminal = {
              item.get("properties", {}).get("status", "")
              for item in executions
              if item.get("properties", {}).get("status", "") not in terminal
          }
          if nonterminal:
              raise SystemExit(
                  f"Migration execution state is active or ambiguous ({sorted(nonterminal)}); "
                  "refusing concurrent mutation."
              )
          PY

          az rest --method post --uri "${job_uri}/start?api-version=2026-01-01" \
            --output json > "$IMAGE_DIR/execution-start.json"
          execution_name=""
          for _ in $(seq 1 30); do
            az rest --method get --uri "${job_uri}/executions?api-version=2026-01-01" \
              --output json > "$IMAGE_DIR/executions-after.json"
            execution_name="$(
              python3 - \
                "$IMAGE_DIR/executions-before.json" \
                "$IMAGE_DIR/execution-start.json" \
                "$IMAGE_DIR/executions-after.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          before = {
              item.get("name")
              for item in json.loads(Path(sys.argv[1]).read_text(encoding="utf-8")).get("value", [])
              if item.get("name")
          }
          response_text = Path(sys.argv[2]).read_text(encoding="utf-8").strip()
          response_name = ""
          if response_text:
              response = json.loads(response_text)
              response_name = response.get("name", "")
          current = [
              item.get("name")
              for item in json.loads(Path(sys.argv[3]).read_text(encoding="utf-8")).get("value", [])
              if item.get("name") and item.get("name") not in before
          ]
          if len(current) > 1:
              raise SystemExit("Multiple new migration executions appeared; refusing an ambiguous result.")
          if response_name in current:
              print(response_name)
          elif len(current) == 1:
              print(current[0])
          PY
            )"
            if [[ -n "$execution_name" ]]; then
              break
            fi
            sleep 2
          done
          test -n "$execution_name" || {
            echo "::error::Azure did not expose the newly started migration execution."
            exit 1
          }

          terminal_status=""
          for _ in $(seq 1 190); do
            az rest --method get \
              --uri "${job_uri}/executions/${execution_name}?api-version=2026-01-01" \
              --output json > "$IMAGE_DIR/execution-current.json"
            status="$(
              python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("properties", {}).get("status", ""))' \
                "$IMAGE_DIR/execution-current.json"
            )"
            case "$status" in
              Succeeded)
                terminal_status="$status"
                break
                ;;
              Failed | Stopped | Degraded)
                echo "::error::Migration execution failed with terminal status ${status}."
                exit 1
                ;;
              "" | Pending | Processing | Running | Starting)
                sleep 10
                ;;
              *)
                echo "::error::Migration execution returned unknown status ${status}."
                exit 1
                ;;
            esac
          done
          test "$terminal_status" = "Succeeded" || {
            echo "::error::Migration execution did not complete before the timeout."
            exit 1
          }
          EXPECTED_IMAGE="$expected_image" python3 - \
            "$IMAGE_DIR/execution-current.json" "$config" <<'PY'
          import json
          import os
          import sys

          execution = json.load(open(sys.argv[1], encoding="utf-8"))
          config = json.load(open(sys.argv[2], encoding="utf-8"))
          containers = execution.get("properties", {}).get("template", {}).get("containers", [])
          if len(containers) != 1 or containers[0].get("image") != os.environ["EXPECTED_IMAGE"]:
              raise SystemExit("Successful migration execution did not use the reviewed ACR digest.")
          if (
              containers[0].get("command") != config["image"]["migrationCommand"]
              or containers[0].get("args") != config["image"]["migrationArguments"]
          ):
              raise SystemExit("Successful migration execution used an unreviewed entrypoint.")
          PY

          evidence_dir="delivery-artifacts/migration-evidence"
          mkdir -p "$evidence_dir"
          export EVIDENCE_DIR="$evidence_dir"
          export EXECUTION_NAME="$execution_name"
          export EXECUTION_STATUS="$terminal_status"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          image = json.loads(
              (Path(os.environ["IMAGE_DIR"]) / "image-evidence.json").read_text(encoding="utf-8")
          )
          evidence = {
              **image,
              "migrationExecutionName": os.environ["EXECUTION_NAME"],
              "migrationStatus": os.environ["EXECUTION_STATUS"],
              "identityPurpose": "migration-runtime",
          }
          root = Path(os.environ["EVIDENCE_DIR"])
          root.joinpath("migration-evidence.json").write_text(
              json.dumps(evidence, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          (
            cd "$evidence_dir"
            sha256sum migration-evidence.json > migration-evidence.sha256
          )

      - name: Upload successful migration evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-migration-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: delivery-artifacts/migration-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Clear Azure session and protected files
        if: always()
        shell: bash
        run: |
          az logout >/dev/null 2>&1 || true
          az account clear >/dev/null 2>&1 || true
          rm -rf delivery-artifacts "$AZURE_CONFIG_DIR"

  plan-application:
    name: OIDC what-if identity (inactive application candidate)
    needs: run-migrations
    runs-on:
      group: production-vnet-runners
      labels:
        - self-hosted
        - linux
        - x64
        - vnet-connected
        - production
        - azure-cli-2-88-0
    timeout-minutes: 35
    environment: production
    permissions:
      id-token: write
    env:
      AZURE_CONFIG_DIR: ${{ github.workspace }}/.azure-application-plan

    steps:
      - name: Reset runner-local delivery state
        shell: bash
        run: rm -rf -- delivery-artifacts "$AZURE_CONFIG_DIR"

      - name: Download source, image, and successful migration evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern:
            production-{release-source,image-evidence,migration-evidence}-${{ github.run_id }}-${{
            github.run_attempt }}
          path: delivery-artifacts
          merge-multiple: false

      - name: Verify pre-application evidence before OIDC
        shell: bash
        env:
          EXPECTED_CONFIG_SHA256: ${{ inputs.config_sha256 }}
          EXPECTED_SHA: ${{ github.sha }}
          PRODUCTION_CONFIG_JSON: ${{ secrets.PRODUCTION_CONFIG_JSON }}
        run: |
          set -euo pipefail
          source_dir="delivery-artifacts/production-release-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image_dir="delivery-artifacts/production-image-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          migration_dir="delivery-artifacts/production-migration-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          state_dir="delivery-artifacts/private-application-plan"
          config_path="$state_dir/production.config.json"
          parameters_path="$state_dir/application.parameters.json"
          mkdir -p "$state_dir"
          umask 077
          test -n "$PRODUCTION_CONFIG_JSON"
          printf '%s' "$PRODUCTION_CONFIG_JSON" > "$config_path"
          test "$(sha256sum "$config_path" | cut -d ' ' -f 1)" = "$EXPECTED_CONFIG_SHA256"
          (cd "$source_dir" && sha256sum --check --strict release.sha256)
          (cd "$image_dir" && sha256sum --check --strict image-evidence.sha256)
          (cd "$migration_dir" && sha256sum --check --strict migration-evidence.sha256)
          test "$(az version --query '"azure-cli"' --output tsv)" = "2.88.0"
          export SOURCE_DIR="$source_dir"
          export IMAGE_DIR="$image_dir"
          export MIGRATION_DIR="$migration_dir"
          export CONFIG_PATH="$config_path"
          export PARAMETERS_PATH="$parameters_path"
          export STATE_DIR="$state_dir"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          source = json.loads(
              (Path(os.environ["SOURCE_DIR"]) / "release-evidence.json").read_text(encoding="utf-8")
          )
          image = json.loads(
              (Path(os.environ["IMAGE_DIR"]) / "image-evidence.json").read_text(encoding="utf-8")
          )
          migration = json.loads(
              (Path(os.environ["MIGRATION_DIR"]) / "migration-evidence.json").read_text(encoding="utf-8")
          )
          for key in (
              "runId", "runAttempt", "commitSha", "configSha256",
              "bicepSha256", "templateSha256", "imageId",
              "azureTarget", "federatedClientIds",
          ):
              if source.get(key) != image.get(key) or image.get(key) != migration.get(key):
                  raise SystemExit(f"Migration evidence is not bound to image field {key}.")
          if image.get("imageDigest") != migration.get("imageDigest"):
              raise SystemExit("Migration evidence is not bound to the verified image digest.")
          if source["commitSha"] != os.environ["EXPECTED_SHA"] or source["configSha256"] != os.environ["EXPECTED_CONFIG_SHA256"]:
              raise SystemExit("Application evidence does not match this workflow.")
          if source.get("azureTarget") != {
              "tenantId": os.environ["DELIVERY_AZURE_TENANT_ID"].lower(),
              "subscriptionId": os.environ["DELIVERY_AZURE_SUBSCRIPTION_ID"].lower(),
          } or source.get("federatedClientIds") != {
              "whatIf": os.environ["DELIVERY_WHAT_IF_CLIENT_ID"].lower(),
              "registryPush": os.environ["DELIVERY_REGISTRY_PUSH_CLIENT_ID"].lower(),
              "infrastructureDeployment": os.environ[
                  "DELIVERY_INFRA_DEPLOY_CLIENT_ID"
              ].lower(),
              "migrationRuntime": os.environ[
                  "DELIVERY_MIGRATION_RUNTIME_CLIENT_ID"
              ].lower(),
          }:
              raise SystemExit("Application planning target identities changed.")
          if (
              migration.get("migrationStatus") != "Succeeded"
              or migration.get("identityPurpose") != "migration-runtime"
              or not migration.get("migrationExecutionName")
          ):
              raise SystemExit("Application planning requires successful migration evidence.")
          PY
          echo "SOURCE_DIR=$source_dir" >> "$GITHUB_ENV"
          echo "IMAGE_DIR=$image_dir" >> "$GITHUB_ENV"
          echo "CONFIG_PATH=$config_path" >> "$GITHUB_ENV"
          echo "PARAMETERS_PATH=$parameters_path" >> "$GITHUB_ENV"
          echo "STATE_DIR=$state_dir" >> "$GITHUB_ENV"

      - name: Log in with the what-if federated identity
        uses: Azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_WHAT_IF_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: false

      - name: Capture current traffic and produce exact application what-if
        shell: bash
        run: |
          set -euo pipefail
          plan_dir="delivery-artifacts/application-plan"
          mkdir -p "$plan_dir"
          config="$CONFIG_PATH"
          account_path="$STATE_DIR/account.json"
          az account show --output json > "$account_path"
          SOURCE_EVIDENCE="$SOURCE_DIR/release-evidence.json" \
            ACCOUNT_PATH="$account_path" EXPECTED_PURPOSE="whatIf" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = json.loads(
              Path(os.environ["SOURCE_EVIDENCE"]).read_text(encoding="utf-8")
          )
          account = json.loads(Path(os.environ["ACCOUNT_PATH"]).read_text(encoding="utf-8"))
          target = evidence["azureTarget"]
          identities = evidence["federatedClientIds"]
          if target != {
              "tenantId": os.environ["DELIVERY_AZURE_TENANT_ID"].lower(),
              "subscriptionId": os.environ["DELIVERY_AZURE_SUBSCRIPTION_ID"].lower(),
          } or identities != {
              "whatIf": os.environ["DELIVERY_WHAT_IF_CLIENT_ID"].lower(),
              "registryPush": os.environ["DELIVERY_REGISTRY_PUSH_CLIENT_ID"].lower(),
              "infrastructureDeployment": os.environ[
                  "DELIVERY_INFRA_DEPLOY_CLIENT_ID"
              ].lower(),
              "migrationRuntime": os.environ[
                  "DELIVERY_MIGRATION_RUNTIME_CLIENT_ID"
              ].lower(),
          }:
              raise SystemExit("Application target variables changed after migration.")
          if (
              str(account.get("tenantId", "")).lower() != target["tenantId"]
              or str(account.get("id", "")).lower() != target["subscriptionId"]
              or str(account.get("user", {}).get("type", "")).lower()
              != "serviceprincipal"
              or str(account.get("user", {}).get("name", "")).lower()
              != identities[os.environ["EXPECTED_PURPOSE"]]
          ):
              raise SystemExit("The authenticated application what-if identity is not reviewed.")
          PY
          readarray -t values < <(
            python3 - "$config" <<'PY'
          import json
          import sys

          config = json.load(open(sys.argv[1], encoding="utf-8"))
          print(config["primaryLocation"])
          print(config["names"]["resourceGroup"])
          print(config["names"]["webContainerApp"])
          print(config["network"]["subnets"]["applicationGateway"])
          PY
          )
          location="${values[0]}"
          resource_group="${values[1]}"
          web_app="${values[2]}"
          app_gateway_subnet="${values[3]}"
          app_uri="https://management.azure.com/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${resource_group}/providers/Microsoft.App/containerApps/${web_app}"

          app_exists="false"
          if az rest --method get --uri "${app_uri}?api-version=2026-01-01" \
            --output json > "$STATE_DIR/current-app.json" 2> "$STATE_DIR/current-app.error"; then
            app_exists="true"
            az rest --method get --uri "${app_uri}/revisions?api-version=2026-01-01" \
              --output json > "$STATE_DIR/current-revisions.json"
          else
            if ! grep -Eq 'ResourceNotFound|ContainerAppNotFound|could not be found' "$STATE_DIR/current-app.error"; then
              cat "$STATE_DIR/current-app.error" >&2
              exit 1
            fi
            printf '{}\n' > "$STATE_DIR/current-app.json"
            printf '{"value":[]}\n' > "$STATE_DIR/current-revisions.json"
          fi
          readarray -t posture < <(
            APP_EXISTS="$app_exists" APP_GATEWAY_SUBNET="$app_gateway_subnet" python3 - \
              "$STATE_DIR/current-app.json" "$STATE_DIR/current-revisions.json" <<'PY'
          import json
          import os
          import sys

          app = json.load(open(sys.argv[1], encoding="utf-8"))
          revisions = json.load(open(sys.argv[2], encoding="utf-8")).get("value", [])
          traffic = [
              item for item in revisions
              if int(item.get("properties", {}).get("trafficWeight", 0) or 0) > 0
          ]
          if os.environ["APP_EXISTS"] == "false":
              if traffic:
                  raise SystemExit("Traffic exists for an application reported as absent.")
              print("")
              print("")
          else:
              if len(traffic) != 1:
                  raise SystemExit("Expected exactly one active revision in the current posture.")
              revision = traffic[0]
              if int(revision.get("properties", {}).get("trafficWeight", 0)) != 100:
                  raise SystemExit("The active revision must own 100 percent of traffic.")
              ingress = (
                  app.get("properties", {})
                  .get("configuration", {})
                  .get("ingress", {})
              )
              restrictions = {
                  (item.get("action"), item.get("ipAddressRange"), item.get("name"))
                  for item in ingress.get("ipSecurityRestrictions", [])
              }
              serving = {
                  ("Allow", os.environ["APP_GATEWAY_SUBNET"], "application-gateway-only")
              }
              staged = {("Deny", "0.0.0.0/0", "staged-deny-all")}
              if ingress.get("external") is True and restrictions == serving:
                  print(revision["name"])
                  print("")
              elif ingress.get("external") is False and restrictions == staged:
                  print("")
                  print(revision["name"])
              else:
                  raise SystemExit("Existing application ingress has an unrecognized exposure posture.")
          PY
          )
          previous_revision="${posture[0]}"
          staged_revision="${posture[1]}"
          run_token="$(
            printf '%s:%s' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
              | sha256sum | cut -c 1-10
          )"
          revision_suffix="${GITHUB_SHA:0:12}-${run_token}"
          new_revision="${web_app}--${revision_suffix}"

          export PREVIOUS_REVISION="$previous_revision"
          export STAGED_REVISION="$staged_revision"
          export REVISION_SUFFIX="$revision_suffix"
          export NEW_REVISION="$new_revision"
          export PLAN_DIR="$plan_dir"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          config = json.loads(Path(os.environ["CONFIG_PATH"]).read_text(encoding="utf-8"))
          image = json.loads(
              (Path(os.environ["IMAGE_DIR"]) / "image-evidence.json").read_text(encoding="utf-8")
          )
          parameters = {
              "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
              "contentVersion": "1.0.0.0",
              "parameters": {
                  "config": {"value": config},
                  "enableFoundry": {"value": False},
                  "deploymentStage": {"value": "application"},
                  "imageDigest": {"value": image["imageDigest"]},
                  "previousRevisionName": {"value": os.environ["PREVIOUS_REVISION"]},
                  "webRevisionSuffix": {"value": os.environ["REVISION_SUFFIX"]},
              },
          }
          Path(os.environ["PARAMETERS_PATH"]).write_text(
              json.dumps(parameters, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

          az deployment sub what-if \
            --name "application-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --location "$location" \
            --template-file "$SOURCE_DIR/main.json" \
            --parameters "@$PARAMETERS_PATH" \
            --result-format FullResourcePayloads \
            --no-pretty-print \
            --only-show-errors \
            --output json > "$STATE_DIR/application.what-if.raw.json"

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          source = Path(os.environ["SOURCE_DIR"])
          image_root = Path(os.environ["IMAGE_DIR"])
          plan = Path(os.environ["PLAN_DIR"])
          release = json.loads((source / "release-evidence.json").read_text(encoding="utf-8"))
          image = json.loads((image_root / "image-evidence.json").read_text(encoding="utf-8"))
          result = json.loads(
              (Path(os.environ["STATE_DIR"]) / "application.what-if.raw.json").read_text(
                  encoding="utf-8"
              )
          )
          changes = result.get("properties", {}).get("changes")
          if not isinstance(changes, list):
              raise SystemExit("Application what-if returned an invalid result.")
          allowed_types = {"Create", "Deploy", "Modify", "NoChange"}
          rejected_types = {"Delete", "Ignore", "Unsupported"}
          rejected = sorted(
              {
                  str(change.get("changeType", ""))
                  for change in changes
                  if change.get("changeType") not in allowed_types
              }
          )
          if rejected:
              raise SystemExit(
                  f"Application what-if contains rejected change types: {rejected}."
              )

          def enforce_policy(value, path=""):
              if isinstance(value, dict):
                  if (
                      str(value.get("action", "")).lower() == "allow"
                      and str(value.get("ipAddressRange", "")) == "0.0.0.0/0"
                  ):
                      raise SystemExit(f"Unsafe allow-all network rule at {path}.")
                  for key, child in value.items():
                      child_path = f"{path}.{key}" if path else key
                      lowered = key.lower()
                      if (
                          lowered.startswith("publicnetworkaccess")
                          and child != "Disabled"
                      ):
                          raise SystemExit(
                              f"Public data-plane access is not disabled at {child_path}."
                          )
                      if lowered == "allowinsecure" and child is True:
                          raise SystemExit(f"Insecure ingress is enabled at {child_path}.")
                      if (
                          lowered == "unauthenticatedclientaction"
                          and child == "AllowAnonymous"
                      ):
                          raise SystemExit(
                              f"Anonymous application access is enabled at {child_path}."
                          )
                      enforce_policy(child, child_path)
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      enforce_policy(child, f"{path}[{index}]")

          for change in changes:
              enforce_policy(
                  change.get("after"), str(change.get("resourceId", "")).lower()
              )

          sensitive = re.compile(
              r"(secret|password|token|credential|connectionstring|privatekey|certificate)",
              re.I,
          )
          visible = re.compile(
              r"(name|type|location|kind|sku|tier|capacity|zones|version|publicnetworkaccess|"
              r"external|ipsecurityrestrictions|ipaddressrange|action|traffic|route|dns|"
              r"fqdn|host|domain|address|subnet|groupids|principal|roledefinition|identity|"
              r"audience|issuer|transport|targetport|image|command|args|replica|scale|tls)",
              re.I,
          )
          subscription_id = release["azureTarget"]["subscriptionId"]

          def canonical(value):
              if isinstance(value, dict):
                  return {key: canonical(value[key]) for key in sorted(value)}
              if isinstance(value, list):
                  items = [canonical(item) for item in value]
                  if items and all(isinstance(item, dict) for item in items):
                      if all("resourceId" in item for item in items):
                          items.sort(key=lambda item: str(item["resourceId"]).lower())
                      elif all("path" in item for item in items):
                          items.sort(key=lambda item: str(item["path"]))
                  return items
              return value

          def digest(value):
              payload = json.dumps(
                  canonical(value), sort_keys=True, separators=(",", ":")
              ).encode()
              return hashlib.sha256(payload).hexdigest()

          def safe_value(path, value):
              if value is None or isinstance(value, (bool, int, float)):
                  return value
              if sensitive.search(path):
                  return {"redacted": True, "type": type(value).__name__}
              if isinstance(value, str) and visible.search(path):
                  return value.replace(subscription_id, "<subscription>")
              return {"sha256": digest(value), "redacted": True}

          def flatten(value, path=""):
              rows = []
              if isinstance(value, dict):
                  for key in sorted(value):
                      rows.extend(
                          flatten(value[key], f"{path}.{key}" if path else key)
                      )
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      rows.extend(flatten(child, f"{path}[{index}]"))
              else:
                  rows.append(
                      {
                          "path": path,
                          "propertyChangeType": "Create",
                          "after": safe_value(path, value),
                      }
                  )
              return rows

          def flatten_delta(entries):
              rows = []
              for entry in entries or []:
                  path = str(entry.get("path", ""))
                  if entry.get("children"):
                      rows.extend(flatten_delta(entry["children"]))
                  else:
                      row = {
                          "path": path,
                          "propertyChangeType": entry.get(
                              "propertyChangeType", "Modify"
                          ),
                      }
                      if "before" in entry:
                          row["before"] = safe_value(path, entry.get("before"))
                      if "after" in entry:
                          row["after"] = safe_value(path, entry.get("after"))
                      rows.append(row)
              return sorted(rows, key=lambda row: row["path"])

          review_changes = []
          for change in sorted(
              changes, key=lambda item: str(item.get("resourceId", "")).lower()
          ):
              change_type = str(change.get("changeType", ""))
              properties = (
                  flatten(change.get("after"))
                  if change_type == "Create"
                  else flatten_delta(change.get("delta", []))
              )
              if change_type == "Modify" and not properties:
                  properties = flatten(change.get("after"))
              review_changes.append(
                  {
                      "resourceId": str(change.get("resourceId", "")).replace(
                          subscription_id, "<subscription>"
                      ),
                      "changeType": change_type,
                      "propertyChanges": properties,
                  }
              )
          review = {
              "schemaVersion": 1,
              "policyVersion": "azure-what-if-v1",
              "stage": "application",
              "allowedChangeTypes": sorted(allowed_types),
              "rejectedChangeTypes": sorted(rejected_types),
              "changeSummary": {
                  change_type: sum(
                      1
                      for change in changes
                      if change.get("changeType") == change_type
                  )
                  for change_type in sorted(
                      {str(change.get("changeType", "")) for change in changes}
                  )
              },
              "changes": review_changes,
          }
          review_path = plan / "application.what-if.review.json"
          review_path.write_text(
              json.dumps(review, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          raw_canonical = json.dumps(
              canonical(result), sort_keys=True, separators=(",", ":")
          ).encode()
          evidence = {
              **release,
              "imageDigest": image["imageDigest"],
              "imageReference": image["imageReference"],
              "stage": "application",
              "identityPurpose": "what-if",
              "previousRevisionName": os.environ["PREVIOUS_REVISION"],
              "stagedRevisionName": os.environ["STAGED_REVISION"],
              "newRevisionName": os.environ["NEW_REVISION"],
              "revisionSuffix": os.environ["REVISION_SUFFIX"],
              "parametersSha256": hashlib.sha256(
                  Path(os.environ["PARAMETERS_PATH"]).read_bytes()
              ).hexdigest(),
              "whatIfStateSha256": hashlib.sha256(raw_canonical).hexdigest(),
              "whatIfReviewSha256": hashlib.sha256(
                  review_path.read_bytes()
              ).hexdigest(),
              "whatIfPolicyVersion": "azure-what-if-v1",
          }
          plan.joinpath("application-plan-evidence.json").write_text(
              json.dumps(evidence, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          rm -f "$STATE_DIR/current-app.error"
          (
            cd "$plan_dir"
            sha256sum \
              application.what-if.review.json \
              application-plan-evidence.json > application-plan.sha256
          )

      - name: Upload application what-if for protected review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-application-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: delivery-artifacts/application-plan
          if-no-files-found: error
          retention-days: 30

      - name: Clear Azure session and protected files
        if: always()
        shell: bash
        run: |
          az logout >/dev/null 2>&1 || true
          az account clear >/dev/null 2>&1 || true
          rm -rf delivery-artifacts "$AZURE_CONFIG_DIR"

  deploy-application:
    name: Protected gate and infrastructure identity (inactive candidate)
    needs: plan-application
    runs-on:
      group: production-vnet-runners
      labels:
        - self-hosted
        - linux
        - x64
        - vnet-connected
        - production
        - azure-cli-2-88-0
    timeout-minutes: 60
    environment: production
    permissions:
      id-token: write
    env:
      AZURE_CONFIG_DIR: ${{ github.workspace }}/.azure-application-deploy

    steps:
      - name: Reset runner-local delivery state
        shell: bash
        run: rm -rf -- delivery-artifacts "$AZURE_CONFIG_DIR"

      - name: Download source, image, and reviewed application plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern:
            production-{release-source,image-evidence,application-plan}-${{ github.run_id }}-${{
            github.run_attempt }}
          path: delivery-artifacts
          merge-multiple: false

      - name: Verify application plan binding before OIDC
        shell: bash
        env:
          EXPECTED_CONFIG_SHA256: ${{ inputs.config_sha256 }}
          EXPECTED_SHA: ${{ github.sha }}
          PRODUCTION_CONFIG_JSON: ${{ secrets.PRODUCTION_CONFIG_JSON }}
        run: |
          set -euo pipefail
          source_dir="delivery-artifacts/production-release-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image_dir="delivery-artifacts/production-image-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          plan_dir="delivery-artifacts/production-application-plan-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          state_dir="delivery-artifacts/private-application-deploy"
          config_path="$state_dir/production.config.json"
          parameters_path="$state_dir/application.parameters.json"
          mkdir -p "$state_dir"
          umask 077
          test -n "$PRODUCTION_CONFIG_JSON"
          printf '%s' "$PRODUCTION_CONFIG_JSON" > "$config_path"
          test "$(sha256sum "$config_path" | cut -d ' ' -f 1)" = "$EXPECTED_CONFIG_SHA256"
          (cd "$source_dir" && sha256sum --check --strict release.sha256)
          (cd "$image_dir" && sha256sum --check --strict image-evidence.sha256)
          (cd "$plan_dir" && sha256sum --check --strict application-plan.sha256)
          test "$(az version --query '"azure-cli"' --output tsv)" = "2.88.0"
          export SOURCE_DIR="$source_dir"
          export IMAGE_DIR="$image_dir"
          export PLAN_DIR="$plan_dir"
          export CONFIG_PATH="$config_path"
          export PARAMETERS_PATH="$parameters_path"
          export STATE_DIR="$state_dir"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          source_root = Path(os.environ["SOURCE_DIR"])
          source = json.loads((source_root / "release-evidence.json").read_text(encoding="utf-8"))
          image = json.loads(
              (Path(os.environ["IMAGE_DIR"]) / "image-evidence.json").read_text(encoding="utf-8")
          )
          plan_root = Path(os.environ["PLAN_DIR"])
          plan = json.loads((plan_root / "application-plan-evidence.json").read_text(encoding="utf-8"))
          if hashlib.sha256((source_root / "main.json").read_bytes()).hexdigest() != source["templateSha256"]:
              raise SystemExit("Compiled template digest changed before application deployment.")
          if hashlib.sha256(Path(os.environ["CONFIG_PATH"]).read_bytes()).hexdigest() != source["configSha256"]:
              raise SystemExit("Production configuration digest changed before application deployment.")
          for key in (
              "runId", "runAttempt", "commitSha", "configSha256",
              "bicepSha256", "templateSha256", "imageId",
              "azureTarget", "federatedClientIds",
          ):
              if source.get(key) != image.get(key) or source.get(key) != plan.get(key):
                  raise SystemExit(f"Application evidence mismatch for {key}.")
          if image.get("imageDigest") != plan.get("imageDigest"):
              raise SystemExit("Application plan is not bound to the verified ACR digest.")
          if source["commitSha"] != os.environ["EXPECTED_SHA"] or source["configSha256"] != os.environ["EXPECTED_CONFIG_SHA256"]:
              raise SystemExit("Application evidence does not match this workflow.")
          if plan.get("stage") != "application" or plan.get("identityPurpose") != "what-if":
              raise SystemExit("Application plan stage or identity purpose is invalid.")
          previous = plan.get("previousRevisionName")
          staged = plan.get("stagedRevisionName")
          if (
              not isinstance(previous, str)
              or not isinstance(staged, str)
              or (previous and staged)
          ):
              raise SystemExit("Application plan has an invalid prior exposure posture.")
          if plan.get("whatIfPolicyVersion") != "azure-what-if-v1":
              raise SystemExit("Application what-if policy version is invalid.")
          if hashlib.sha256((plan_root / "application.what-if.review.json").read_bytes()).hexdigest() != plan["whatIfReviewSha256"]:
              raise SystemExit("Application what-if changed after review.")
          if source.get("azureTarget") != {
              "tenantId": os.environ["DELIVERY_AZURE_TENANT_ID"].lower(),
              "subscriptionId": os.environ["DELIVERY_AZURE_SUBSCRIPTION_ID"].lower(),
          } or source.get("federatedClientIds") != {
              "whatIf": os.environ["DELIVERY_WHAT_IF_CLIENT_ID"].lower(),
              "registryPush": os.environ["DELIVERY_REGISTRY_PUSH_CLIENT_ID"].lower(),
              "infrastructureDeployment": os.environ[
                  "DELIVERY_INFRA_DEPLOY_CLIENT_ID"
              ].lower(),
              "migrationRuntime": os.environ[
                  "DELIVERY_MIGRATION_RUNTIME_CLIENT_ID"
              ].lower(),
          }:
              raise SystemExit("Application deployment target identities changed.")
          config = json.loads(Path(os.environ["CONFIG_PATH"]).read_text(encoding="utf-8"))
          run_token = hashlib.sha256(
              f'{source["runId"]}:{source["runAttempt"]}'.encode()
          ).hexdigest()[:10]
          expected_suffix = f'{source["commitSha"][:12]}-{run_token}'
          expected_revision = f'{config["names"]["webContainerApp"]}--{expected_suffix}'
          if (
              plan.get("revisionSuffix") != expected_suffix
              or plan.get("newRevisionName") != expected_revision
          ):
              raise SystemExit("Application candidate name is not deterministic for this workflow.")
          parameters = {
              "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
              "contentVersion": "1.0.0.0",
              "parameters": {
                  "config": {"value": config},
                  "enableFoundry": {"value": False},
                  "deploymentStage": {"value": "application"},
                  "imageDigest": {"value": image["imageDigest"]},
                  "previousRevisionName": {
                      "value": plan["previousRevisionName"]
                  },
                  "webRevisionSuffix": {"value": plan["revisionSuffix"]},
              },
          }
          parameter_bytes = (
              json.dumps(parameters, sort_keys=True, separators=(",", ":")) + "\n"
          ).encode()
          if hashlib.sha256(parameter_bytes).hexdigest() != plan["parametersSha256"]:
              raise SystemExit("Re-materialized application parameters differ from review.")
          Path(os.environ["PARAMETERS_PATH"]).write_bytes(parameter_bytes)
          PY
          echo "SOURCE_DIR=$source_dir" >> "$GITHUB_ENV"
          echo "PLAN_DIR=$plan_dir" >> "$GITHUB_ENV"
          echo "CONFIG_PATH=$config_path" >> "$GITHUB_ENV"
          echo "PARAMETERS_PATH=$parameters_path" >> "$GITHUB_ENV"
          echo "STATE_DIR=$state_dir" >> "$GITHUB_ENV"

      - name: Log in with the infrastructure deployment federated identity
        uses: Azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_INFRA_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: false

      - name: Recheck prior traffic and deploy candidate without shifting it
        shell: bash
        run: |
          set -euo pipefail
          account_path="$STATE_DIR/account.json"
          az account show --output json > "$account_path"
          SOURCE_EVIDENCE="$SOURCE_DIR/release-evidence.json" \
            ACCOUNT_PATH="$account_path" EXPECTED_PURPOSE="infrastructureDeployment" \
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = json.loads(
              Path(os.environ["SOURCE_EVIDENCE"]).read_text(encoding="utf-8")
          )
          account = json.loads(Path(os.environ["ACCOUNT_PATH"]).read_text(encoding="utf-8"))
          target = evidence["azureTarget"]
          identities = evidence["federatedClientIds"]
          if target != {
              "tenantId": os.environ["DELIVERY_AZURE_TENANT_ID"].lower(),
              "subscriptionId": os.environ["DELIVERY_AZURE_SUBSCRIPTION_ID"].lower(),
          } or identities != {
              "whatIf": os.environ["DELIVERY_WHAT_IF_CLIENT_ID"].lower(),
              "registryPush": os.environ["DELIVERY_REGISTRY_PUSH_CLIENT_ID"].lower(),
              "infrastructureDeployment": os.environ[
                  "DELIVERY_INFRA_DEPLOY_CLIENT_ID"
              ].lower(),
              "migrationRuntime": os.environ[
                  "DELIVERY_MIGRATION_RUNTIME_CLIENT_ID"
              ].lower(),
          }:
              raise SystemExit("Application deployment target variables changed.")
          if (
              str(account.get("tenantId", "")).lower() != target["tenantId"]
              or str(account.get("id", "")).lower() != target["subscriptionId"]
              or str(account.get("user", {}).get("type", "")).lower()
              != "serviceprincipal"
              or str(account.get("user", {}).get("name", "")).lower()
              != identities[os.environ["EXPECTED_PURPOSE"]]
          ):
              raise SystemExit("The authenticated application deployment identity is not reviewed.")
          PY
          readarray -t values < <(
            python3 - "$CONFIG_PATH" "$PLAN_DIR/application-plan-evidence.json" <<'PY'
          import json
          import sys

          config = json.load(open(sys.argv[1], encoding="utf-8"))
          evidence = json.load(open(sys.argv[2], encoding="utf-8"))
          print(config["primaryLocation"])
          print(config["names"]["resourceGroup"])
          print(config["names"]["webContainerApp"])
          print(config["network"]["subnets"]["applicationGateway"])
          print(evidence["previousRevisionName"])
          print(evidence["stagedRevisionName"])
          PY
          )
          location="${values[0]}"
          resource_group="${values[1]}"
          web_app="${values[2]}"
          app_gateway_subnet="${values[3]}"
          previous_revision="${values[4]}"
          staged_revision="${values[5]}"
          app_uri="https://management.azure.com/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${resource_group}/providers/Microsoft.App/containerApps/${web_app}"

          if [[ -n "$previous_revision" || -n "$staged_revision" ]]; then
            az rest --method get --uri "${app_uri}?api-version=2026-01-01" \
              --output json > "$STATE_DIR/app-before-deploy.json"
            az rest --method get --uri "${app_uri}/revisions?api-version=2026-01-01" \
              --output json > "$STATE_DIR/revisions-before-deploy.json"
            PREVIOUS_REVISION="$previous_revision" STAGED_REVISION="$staged_revision" \
              APP_GATEWAY_SUBNET="$app_gateway_subnet" python3 - \
              "$STATE_DIR/app-before-deploy.json" "$STATE_DIR/revisions-before-deploy.json" <<'PY'
          import json
          import os
          import sys

          app = json.load(open(sys.argv[1], encoding="utf-8"))
          revisions = json.load(open(sys.argv[2], encoding="utf-8")).get("value", [])
          traffic = {
              item["name"]: int(item.get("properties", {}).get("trafficWeight", 0) or 0)
              for item in revisions
              if int(item.get("properties", {}).get("trafficWeight", 0) or 0) > 0
          }
          previous = os.environ["PREVIOUS_REVISION"]
          staged = os.environ["STAGED_REVISION"]
          expected_revision = previous or staged
          if bool(previous) == bool(staged) or traffic != {expected_revision: 100}:
              raise SystemExit("Application traffic changed after what-if; re-plan is required.")
          ingress = (
              app.get("properties", {})
              .get("configuration", {})
              .get("ingress", {})
          )
          restrictions = {
              (item.get("action"), item.get("ipAddressRange"), item.get("name"))
              for item in ingress.get("ipSecurityRestrictions", [])
          }
          expected_restriction = (
              ("Allow", os.environ["APP_GATEWAY_SUBNET"], "application-gateway-only")
              if previous
              else ("Deny", "0.0.0.0/0", "staged-deny-all")
          )
          if (
              ingress.get("external") is not bool(previous)
              or restrictions != {expected_restriction}
          ):
              raise SystemExit("Application exposure changed after what-if; re-plan is required.")
          PY
          else
            if az rest --method get --uri "${app_uri}?api-version=2026-01-01" \
              --output none 2> "$STATE_DIR/app-exists.error"; then
              echo "::error::An application appeared after the first-bootstrap what-if; re-plan is required."
              exit 1
            fi
            grep -Eq 'ResourceNotFound|ContainerAppNotFound|could not be found' "$STATE_DIR/app-exists.error"
          fi

          fresh_what_if="$STATE_DIR/application.what-if.fresh.json"
          az deployment sub what-if \
            --name "application-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --location "$location" \
            --template-file "$SOURCE_DIR/main.json" \
            --parameters "@$PARAMETERS_PATH" \
            --result-format FullResourcePayloads \
            --no-pretty-print \
            --only-show-errors \
            --output json > "$fresh_what_if"
          FRESH_WHAT_IF="$fresh_what_if" \
            PLAN_EVIDENCE="$PLAN_DIR/application-plan-evidence.json" python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def canonical(value):
              if isinstance(value, dict):
                  return {key: canonical(value[key]) for key in sorted(value)}
              if isinstance(value, list):
                  items = [canonical(item) for item in value]
                  if items and all(isinstance(item, dict) for item in items):
                      if all("resourceId" in item for item in items):
                          items.sort(key=lambda item: str(item["resourceId"]).lower())
                      elif all("path" in item for item in items):
                          items.sort(key=lambda item: str(item["path"]))
                  return items
              return value

          result = json.loads(
              Path(os.environ["FRESH_WHAT_IF"]).read_text(encoding="utf-8")
          )
          changes = result.get("properties", {}).get("changes")
          if not isinstance(changes, list):
              raise SystemExit("Fresh application what-if returned an invalid result.")
          allowed_types = {"Create", "Deploy", "Modify", "NoChange"}
          rejected = {
              str(change.get("changeType", ""))
              for change in changes
              if change.get("changeType") not in allowed_types
          }
          if rejected:
              raise SystemExit(f"Fresh application what-if is unsafe: {sorted(rejected)}.")
          reviewed = json.loads(
              Path(os.environ["PLAN_EVIDENCE"]).read_text(encoding="utf-8")
          )
          payload = json.dumps(
              canonical(result), sort_keys=True, separators=(",", ":")
          ).encode()
          if hashlib.sha256(payload).hexdigest() != reviewed["whatIfStateSha256"]:
              raise SystemExit(
                  "Azure state changed after application review; re-plan is required."
              )
          PY
          az deployment sub create \
            --name "application-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --location "$location" \
            --template-file "$SOURCE_DIR/main.json" \
            --parameters "@$PARAMETERS_PATH" \
            --only-show-errors \
            --output none

      - name: Clear Azure session and protected files
        if: always()
        shell: bash
        run: |
          az logout >/dev/null 2>&1 || true
          az account clear >/dev/null 2>&1 || true
          rm -rf delivery-artifacts "$AZURE_CONFIG_DIR"

  activate-and-verify:
    name: Migration/runtime identity (traffic, auth, health, telemetry)
    needs: deploy-application
    runs-on:
      group: production-vnet-runners
      labels:
        - self-hosted
        - linux
        - x64
        - vnet-connected
        - production
        - azure-cli-2-88-0
    timeout-minutes: 45
    environment: production
    permissions:
      id-token: write
    env:
      AZURE_CONFIG_DIR: ${{ github.workspace }}/.azure-runtime-activation

    steps:
      - name: Reset runner-local delivery state
        shell: bash
        run: |
          rm -rf -- delivery-artifacts "$AZURE_CONFIG_DIR"
          rm -f -- \
            rollback-traffic.json \
            rollback-revisions.json \
            rollback-app.json \
            rollback-unauthenticated.headers \
            rollback-forged.headers

      - name: Download release, image, migration, and application evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern:
            production-{release-source,image-evidence,migration-evidence,application-plan}-${{
            github.run_id }}-${{ github.run_attempt }}
          path: delivery-artifacts
          merge-multiple: false

      - name: Verify complete rollout chain before OIDC
        shell: bash
        env:
          EXPECTED_CONFIG_SHA256: ${{ inputs.config_sha256 }}
          EXPECTED_SHA: ${{ github.sha }}
          PRODUCTION_CONFIG_JSON: ${{ secrets.PRODUCTION_CONFIG_JSON }}
        run: |
          set -euo pipefail
          source_dir="delivery-artifacts/production-release-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image_dir="delivery-artifacts/production-image-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          migration_dir="delivery-artifacts/production-migration-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          plan_dir="delivery-artifacts/production-application-plan-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          state_dir="delivery-artifacts/private-runtime-activation"
          config_path="$state_dir/production.config.json"
          mkdir -p "$state_dir"
          umask 077
          test -n "$PRODUCTION_CONFIG_JSON"
          printf '%s' "$PRODUCTION_CONFIG_JSON" > "$config_path"
          test "$(sha256sum "$config_path" | cut -d ' ' -f 1)" = "$EXPECTED_CONFIG_SHA256"
          (cd "$source_dir" && sha256sum --check --strict release.sha256)
          (cd "$image_dir" && sha256sum --check --strict image-evidence.sha256)
          (cd "$migration_dir" && sha256sum --check --strict migration-evidence.sha256)
          (cd "$plan_dir" && sha256sum --check --strict application-plan.sha256)
          test "$(az version --query '"azure-cli"' --output tsv)" = "2.88.0"
          export SOURCE_DIR="$source_dir"
          export IMAGE_DIR="$image_dir"
          export MIGRATION_DIR="$migration_dir"
          export PLAN_DIR="$plan_dir"
          export CONFIG_PATH="$config_path"
          export STATE_DIR="$state_dir"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          source = json.loads(
              (Path(os.environ["SOURCE_DIR"]) / "release-evidence.json").read_text(encoding="utf-8")
          )
          image = json.loads(
              (Path(os.environ["IMAGE_DIR"]) / "image-evidence.json").read_text(encoding="utf-8")
          )
          migration = json.loads(
              (Path(os.environ["MIGRATION_DIR"]) / "migration-evidence.json").read_text(encoding="utf-8")
          )
          plan = json.loads(
              (Path(os.environ["PLAN_DIR"]) / "application-plan-evidence.json").read_text(encoding="utf-8")
          )
          source_root = Path(os.environ["SOURCE_DIR"])
          if hashlib.sha256((source_root / "main.json").read_bytes()).hexdigest() != source["templateSha256"]:
              raise SystemExit("Compiled template changed before traffic activation.")
          if hashlib.sha256(Path(os.environ["CONFIG_PATH"]).read_bytes()).hexdigest() != source["configSha256"]:
              raise SystemExit("Production configuration changed before traffic activation.")
          for key in (
              "runId", "runAttempt", "commitSha", "configSha256",
              "bicepSha256", "templateSha256", "imageId",
              "azureTarget", "federatedClientIds",
          ):
              values = [record.get(key) for record in (source, image, migration, plan)]
              if any(value != values[0] for value in values[1:]):
                  raise SystemExit(f"Rollout chain mismatch for {key}.")
          if len({record.get("imageDigest") for record in (image, migration, plan)}) != 1:
              raise SystemExit("Rollout chain mismatch for imageDigest.")
          if source["commitSha"] != os.environ["EXPECTED_SHA"] or source["configSha256"] != os.environ["EXPECTED_CONFIG_SHA256"]:
              raise SystemExit("Rollout chain does not match this workflow.")
          if (
              migration.get("migrationStatus") != "Succeeded"
              or migration.get("identityPurpose") != "migration-runtime"
              or not migration.get("migrationExecutionName")
          ):
              raise SystemExit("Traffic activation requires successful migration evidence.")
          if plan.get("stage") != "application" or plan.get("identityPurpose") != "what-if":
              raise SystemExit("Traffic activation requires reviewed application what-if evidence.")
          if plan.get("whatIfPolicyVersion") != "azure-what-if-v1":
              raise SystemExit("Traffic activation requires the reviewed what-if policy.")
          if source.get("azureTarget") != {
              "tenantId": os.environ["DELIVERY_AZURE_TENANT_ID"].lower(),
              "subscriptionId": os.environ["DELIVERY_AZURE_SUBSCRIPTION_ID"].lower(),
          } or source.get("federatedClientIds") != {
              "whatIf": os.environ["DELIVERY_WHAT_IF_CLIENT_ID"].lower(),
              "registryPush": os.environ["DELIVERY_REGISTRY_PUSH_CLIENT_ID"].lower(),
              "infrastructureDeployment": os.environ[
                  "DELIVERY_INFRA_DEPLOY_CLIENT_ID"
              ].lower(),
              "migrationRuntime": os.environ[
                  "DELIVERY_MIGRATION_RUNTIME_CLIENT_ID"
              ].lower(),
          }:
              raise SystemExit("Traffic activation target identities changed.")
          previous = plan.get("previousRevisionName")
          staged = plan.get("stagedRevisionName")
          if (
              not isinstance(previous, str)
              or not isinstance(staged, str)
              or (previous and staged)
          ):
              raise SystemExit("Traffic activation has an invalid prior exposure posture.")
          config = json.loads(Path(os.environ["CONFIG_PATH"]).read_text(encoding="utf-8"))
          run_token = hashlib.sha256(
              f'{source["runId"]}:{source["runAttempt"]}'.encode()
          ).hexdigest()[:10]
          expected_suffix = f'{source["commitSha"][:12]}-{run_token}'
          if (
              plan.get("revisionSuffix") != expected_suffix
              or plan.get("newRevisionName")
              != f'{config["names"]["webContainerApp"]}--{expected_suffix}'
          ):
              raise SystemExit("Traffic activation candidate name is not deterministic.")
          plan_root = Path(os.environ["PLAN_DIR"])
          if hashlib.sha256((plan_root / "application.what-if.review.json").read_bytes()).hexdigest() != plan["whatIfReviewSha256"]:
              raise SystemExit("Application what-if changed before traffic activation.")
          PY
          echo "SOURCE_DIR=$source_dir" >> "$GITHUB_ENV"
          echo "IMAGE_DIR=$image_dir" >> "$GITHUB_ENV"
          echo "PLAN_DIR=$plan_dir" >> "$GITHUB_ENV"
          echo "CONFIG_PATH=$config_path" >> "$GITHUB_ENV"
          echo "STATE_DIR=$state_dir" >> "$GITHUB_ENV"

      - name: Log in with the migration/runtime federated identity
        id: runtime_login
        uses: Azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_MIGRATION_RUNTIME_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: false

      - name: Verify candidate, shift traffic, and roll back on any acceptance failure
        shell: bash
        run: |
          set -Eeuo pipefail
          evidence_dir="delivery-artifacts/rollout-evidence"
          mkdir -p "$evidence_dir"
          config="$CONFIG_PATH"
          account_path="$STATE_DIR/account.json"
          az account show --output json > "$account_path"
          SOURCE_EVIDENCE="$SOURCE_DIR/release-evidence.json" \
            ACCOUNT_PATH="$account_path" EXPECTED_PURPOSE="migrationRuntime" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = json.loads(
              Path(os.environ["SOURCE_EVIDENCE"]).read_text(encoding="utf-8")
          )
          account = json.loads(Path(os.environ["ACCOUNT_PATH"]).read_text(encoding="utf-8"))
          target = evidence["azureTarget"]
          identities = evidence["federatedClientIds"]
          if target != {
              "tenantId": os.environ["DELIVERY_AZURE_TENANT_ID"].lower(),
              "subscriptionId": os.environ["DELIVERY_AZURE_SUBSCRIPTION_ID"].lower(),
          } or identities != {
              "whatIf": os.environ["DELIVERY_WHAT_IF_CLIENT_ID"].lower(),
              "registryPush": os.environ["DELIVERY_REGISTRY_PUSH_CLIENT_ID"].lower(),
              "infrastructureDeployment": os.environ[
                  "DELIVERY_INFRA_DEPLOY_CLIENT_ID"
              ].lower(),
              "migrationRuntime": os.environ[
                  "DELIVERY_MIGRATION_RUNTIME_CLIENT_ID"
              ].lower(),
          }:
              raise SystemExit("Runtime activation target variables changed.")
          if (
              str(account.get("tenantId", "")).lower() != target["tenantId"]
              or str(account.get("id", "")).lower() != target["subscriptionId"]
              or str(account.get("user", {}).get("type", "")).lower()
              != "serviceprincipal"
              or str(account.get("user", {}).get("name", "")).lower()
              != identities[os.environ["EXPECTED_PURPOSE"]]
          ):
              raise SystemExit("The authenticated runtime activation identity is not reviewed.")
          PY
          readarray -t values < <(
            python3 - "$config" "$PLAN_DIR/application-plan-evidence.json" "$IMAGE_DIR/image-evidence.json" <<'PY'
          import json
          import sys

          config = json.load(open(sys.argv[1], encoding="utf-8"))
          plan = json.load(open(sys.argv[2], encoding="utf-8"))
          image = json.load(open(sys.argv[3], encoding="utf-8"))
          print(config["names"]["resourceGroup"])
          print(config["names"]["webContainerApp"])
          print(config["names"]["logAnalytics"])
          print(config["dns"]["publicHost"])
          print(config["primaryLocation"])
          print(plan["previousRevisionName"])
          print(plan["newRevisionName"])
          print(image["imageReference"])
          print(config["network"]["subnets"]["applicationGateway"])
          PY
          )
          resource_group="${values[0]}"
          web_app="${values[1]}"
          log_analytics="${values[2]}"
          public_host="${values[3]}"
          app_location="${values[4]}"
          previous_revision="${values[5]}"
          new_revision="${values[6]}"
          expected_image="${values[7]}"
          app_gateway_subnet="${values[8]}"
          app_uri="https://management.azure.com/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${resource_group}/providers/Microsoft.App/containerApps/${web_app}"
          traffic_shifted="false"

          verify_public_service() {
            probe_name="$1"
            public_url="https://${public_host}"
            healthy="false"
            for _ in $(seq 1 30); do
              live_status="$(curl --proto '=https' --tlsv1.2 --silent --show-error \
                --output /dev/null --write-out '%{http_code}' --max-time 10 \
                "${public_url}/health/live" || true)"
              ready_status="$(curl --proto '=https' --tlsv1.2 --silent --show-error \
                --output /dev/null --write-out '%{http_code}' --max-time 10 \
                "${public_url}/health/ready" || true)"
              if [[ "$live_status" = "200" && "$ready_status" = "200" ]]; then
                healthy="true"
                break
              fi
              sleep 10
            done
            [[ "$healthy" = "true" ]] || return 1
            curl --proto '=https' --tlsv1.2 --silent --show-error \
              --dump-header "$evidence_dir/${probe_name}-unauthenticated.headers" \
              --output /dev/null --max-time 15 "${public_url}/api/v1/health" || return 1
            curl --proto '=https' --tlsv1.2 --silent --show-error \
              --header 'X-MS-CLIENT-PRINCIPAL: forged' \
              --dump-header "$evidence_dir/${probe_name}-forged.headers" \
              --output /dev/null --max-time 15 "${public_url}/api/v1/health" || return 1
            PUBLIC_HOST="$public_host" python3 - \
              "$evidence_dir/${probe_name}-unauthenticated.headers" \
              "$evidence_dir/${probe_name}-forged.headers" <<'PY'
          import os
          import sys
          from urllib.parse import urlparse

          def read_response(path):
              lines = open(path, encoding="utf-8").read().splitlines()
              status_lines = [line for line in lines if line.startswith("HTTP/")]
              if not status_lines:
                  raise SystemExit(1)
              status = int(status_lines[-1].split()[1])
              headers = {}
              for line in lines:
                  if ":" in line:
                      name, value = line.split(":", 1)
                      headers[name.strip().lower()] = value.strip()
              return status, headers.get("location", "")

          normal = read_response(sys.argv[1])
          forged = read_response(sys.argv[2])
          if normal[0] != forged[0]:
              raise SystemExit(1)
          normalized = []
          for status, location in (normal, forged):
              if status not in (302, 303, 307):
                  raise SystemExit(1)
              parsed = urlparse(location)
              if parsed.netloc and parsed.hostname != os.environ["PUBLIC_HOST"]:
                  raise SystemExit(1)
              if not parsed.path.startswith("/.auth/"):
                  raise SystemExit(1)
              normalized.append((parsed.hostname or "", parsed.path))
          if normalized[0] != normalized[1]:
              raise SystemExit(1)
          PY
          }

          rollback() {
            status=$?
            trap - EXIT
            if [[ "$status" -ne 0 && "$traffic_shifted" = "true" ]]; then
              if [[ -n "$previous_revision" ]]; then
                printf '{"location":"%s","properties":{"configuration":{"ingress":{"external":true,"ipSecurityRestrictions":[{"action":"Allow","description":"Only the regional Application Gateway subnet may reach app ingress.","ipAddressRange":"%s","name":"application-gateway-only"}],"traffic":[{"revisionName":"%s","weight":100}]}}}}\n' \
                  "$app_location" "$app_gateway_subnet" "$previous_revision" > "$evidence_dir/rollback-traffic.json"
              else
                printf '{"location":"%s","properties":{"configuration":{"ingress":{"external":false,"ipSecurityRestrictions":[{"action":"Deny","description":"First-bootstrap candidate remains unreachable until post-migration acceptance.","ipAddressRange":"0.0.0.0/0","name":"staged-deny-all"}],"traffic":[{"revisionName":"%s","weight":100}]}}}}\n' \
                  "$app_location" "$new_revision" > "$evidence_dir/rollback-traffic.json"
              fi
              rollback_request_succeeded="false"
              if az rest --method patch \
                --uri "${app_uri}?api-version=2026-01-01" \
                --body "@$evidence_dir/rollback-traffic.json" \
                --output none; then
                rollback_request_succeeded="true"
              fi
              if [[ -n "$previous_revision" ]]; then
                az rest --method post \
                  --uri "${app_uri}/revisions/${new_revision}/deactivate?api-version=2026-01-01" \
                  --output none || echo "::warning::Candidate revision deactivation failed after rollback."
              fi
              rollback_verified="false"
              if [[ "$rollback_request_succeeded" = "true" ]]; then
                for _ in $(seq 1 12); do
                  if az rest --method get \
                    --uri "${app_uri}/revisions?api-version=2026-01-01" \
                    --output json > "$evidence_dir/rollback-revisions.json" \
                    && az rest --method get \
                      --uri "${app_uri}?api-version=2026-01-01" \
                      --output json > "$evidence_dir/rollback-app.json" \
                    && PREVIOUS_REVISION="$previous_revision" NEW_REVISION="$new_revision" \
                      APP_GATEWAY_SUBNET="$app_gateway_subnet" \
                      python3 - "$evidence_dir/rollback-revisions.json" \
                        "$evidence_dir/rollback-app.json" <<'PY'
          import json
          import os
          import sys

          revisions = json.load(open(sys.argv[1], encoding="utf-8")).get("value", [])
          traffic = {
              item["name"]: int(item.get("properties", {}).get("trafficWeight", 0) or 0)
              for item in revisions
              if int(item.get("properties", {}).get("trafficWeight", 0) or 0) > 0
          }
          previous = os.environ["PREVIOUS_REVISION"]
          expected = {previous: 100} if previous else {os.environ["NEW_REVISION"]: 100}
          ingress = (
              json.load(open(sys.argv[2], encoding="utf-8"))
              .get("properties", {})
              .get("configuration", {})
              .get("ingress", {})
          )
          if traffic != expected or ingress.get("external") is not bool(previous):
              raise SystemExit(1)
          restrictions = ingress.get("ipSecurityRestrictions", [])
          expected_restriction = (
              ("Allow", os.environ["APP_GATEWAY_SUBNET"], "application-gateway-only")
              if previous
              else ("Deny", "0.0.0.0/0", "staged-deny-all")
          )
          actual = {
              (item.get("action"), item.get("ipAddressRange"), item.get("name"))
              for item in restrictions
          }
          if actual != {expected_restriction}:
              raise SystemExit(1)
          PY
                  then
                    rollback_verified="true"
                    break
                  fi
                  sleep 5
                done
              fi
              if [[ "$rollback_verified" = "true" && -n "$previous_revision" ]]; then
                if ! verify_public_service "rollback"; then
                  rollback_verified="false"
                fi
              fi
              if [[ "$rollback_verified" = "true" ]]; then
                echo "::error::Application acceptance failed; prior traffic, exposure, health, and authentication were restored. Reviewed non-traffic infrastructure changes remain and require operator review."
              else
                echo "::error::Application acceptance failed and prior service recovery could not be verified; immediate operator action is required."
              fi
            fi
            exit "$status"
          }
          trap rollback EXIT

          revision_uri="${app_uri}/revisions/${new_revision}?api-version=2026-01-01"
          candidate_healthy="false"
          for _ in $(seq 1 60); do
            az rest --method get --uri "$revision_uri" --output json \
              > "$evidence_dir/candidate-revision.json"
            if EXPECTED_IMAGE="$expected_image" python3 - "$evidence_dir/candidate-revision.json" <<'PY'
          import json
          import os
          import sys

          revision = json.load(open(sys.argv[1], encoding="utf-8"))
          properties = revision.get("properties", {})
          containers = properties.get("template", {}).get("containers", [])
          if len(containers) != 1 or containers[0].get("image") != os.environ["EXPECTED_IMAGE"]:
              raise SystemExit(2)
          environment = {
              item.get("name"): item.get("value")
              for item in containers[0].get("env", [])
          }
          expected_environment = {
              "RUNTIME_MODE": "production",
              "LOGGING_MODE": "json",
              "TELEMETRY_MODE": "disabled",
          }
          forbidden_environment = {
              "APPLICATIONINSIGHTS_CONNECTION_STRING",
              "OTEL_EXPORTER_OTLP_ENDPOINT",
          }
          if (
              any(
                  environment.get(name) != value
                  for name, value in expected_environment.items()
              )
              or forbidden_environment.intersection(environment)
          ):
              raise SystemExit(2)
          healthy = (
              properties.get("provisioningState") in {"Provisioned", "Succeeded"}
              and properties.get("runningState") == "Running"
              and properties.get("healthState") == "Healthy"
          )
          raise SystemExit(0 if healthy else 1)
          PY
            then
              candidate_healthy="true"
              break
            else
              result=$?
              if [[ "$result" -eq 2 ]]; then
                echo "::error::Candidate revision does not use the reviewed image and disabled-telemetry runtime contract."
                exit 1
              fi
            fi
            sleep 10
          done
          test "$candidate_healthy" = "true" || {
            echo "::error::Candidate revision never became healthy."
            exit 1
          }

          az rest --method get \
            --uri "${app_uri}/authConfigs/current?api-version=2026-01-01" \
            --output json > "$evidence_dir/auth-config.json"
          python3 - "$evidence_dir/auth-config.json" "$config" <<'PY'
          import json
          import sys
          import uuid

          auth = json.load(open(sys.argv[1], encoding="utf-8")).get("properties", {})
          reviewed = json.load(open(sys.argv[2], encoding="utf-8"))["auth"]
          if auth.get("platform", {}).get("enabled") is not True:
              raise SystemExit("Container Apps authentication is not enabled.")
          global_validation = auth.get("globalValidation", {})
          if global_validation.get("unauthenticatedClientAction") != "RedirectToLoginPage":
              raise SystemExit("Unauthenticated application requests must redirect to login.")
          excluded = global_validation.get("excludedPaths", [])
          if len(excluded) != 2 or set(excluded) != {"/health/live", "/health/ready"}:
              raise SystemExit("Only liveness and readiness may bypass authentication.")

          def uuid_values(values):
              return [str(uuid.UUID(str(value))) for value in values]

          def require_exact(name, actual, expected):
              if len(actual) != len(expected) or set(actual) != set(expected):
                  raise SystemExit(f"Easy Auth {name} differs from reviewed configuration.")

          identity_providers = auth.get("identityProviders", {})
          enabled_providers = set()
          for provider_name, provider in identity_providers.items():
              if provider_name == "customOpenIdConnectProviders":
                  enabled_providers.update(
                      f"custom:{name}"
                      for name, value in provider.items()
                      if value.get("enabled") is True
                  )
              elif isinstance(provider, dict) and provider.get("enabled") is True:
                  enabled_providers.add(provider_name)
          if reviewed.get("provider") == "microsoftEntra":
              if enabled_providers != {"azureActiveDirectory"}:
                  raise SystemExit("Easy Auth has an unreviewed enabled identity provider.")
              if global_validation.get("redirectToProvider") != "azureactivedirectory":
                  raise SystemExit("Easy Auth does not redirect to the reviewed Entra provider.")
              aad_provider = identity_providers.get("azureActiveDirectory", {})
              aad_validation = aad_provider.get("validation", {})
              policy = aad_validation.get("defaultAuthorizationPolicy", {})
              principals = policy.get("allowedPrincipals", {})
              claim_checks = aad_validation.get("jwtClaimChecks", {})
              require_exact(
                  "audiences",
                  aad_validation.get("allowedAudiences", []),
                  [reviewed["audience"]],
              )
              require_exact(
                  "allowed identities",
                  uuid_values(principals.get("identities", [])),
                  uuid_values(reviewed["allowedIdentities"]),
              )
              require_exact(
                  "allowed applications",
                  uuid_values(policy.get("allowedApplications", [])),
                  uuid_values(reviewed["allowedClientApplications"]),
              )
              require_exact(
                  "allowed groups",
                  uuid_values(principals.get("groups", [])),
                  uuid_values(reviewed["allowedGroups"]),
              )
              require_exact(
                  "JWT application checks",
                  uuid_values(claim_checks.get("allowedClientApplications", [])),
                  uuid_values(reviewed["allowedClientApplications"]),
              )
              require_exact(
                  "JWT group checks",
                  uuid_values(claim_checks.get("allowedGroups", [])),
                  uuid_values(reviewed["allowedGroups"]),
              )
          elif reviewed.get("provider") == "customOidc":
              provider_name = reviewed["customProviderName"]
              if enabled_providers != {f"custom:{provider_name}"}:
                  raise SystemExit("Easy Auth has an unreviewed enabled identity provider.")
              if global_validation.get("redirectToProvider") != provider_name:
                  raise SystemExit("Easy Auth does not redirect to the reviewed OIDC provider.")
              providers = identity_providers.get("customOpenIdConnectProviders", {})
              if set(providers) != {provider_name}:
                  raise SystemExit("Easy Auth custom OIDC providers differ from review.")
              provider = providers[provider_name]
              registration = provider.get("registration", {})
              client_credential = registration.get("clientCredential", {})
              configuration = registration.get("openIdConnectConfiguration", {})
              expected_configuration = {
                  "authorizationEndpoint": reviewed["authorizationEndpoint"],
                  "certificationUri": reviewed["certificationUri"],
                  "issuer": reviewed["issuer"],
                  "tokenEndpoint": reviewed["tokenEndpoint"],
                  "wellKnownOpenIdConfiguration": reviewed[
                      "wellKnownOpenIdConfiguration"
                  ],
              }
              if (
                  provider.get("enabled") is not True
                  or provider.get("login", {}).get("nameClaimType")
                  != reviewed["nameClaimType"]
                  or provider.get("login", {}).get("scopes") != reviewed["scopes"]
                  or registration.get("clientId") != reviewed["clientId"]
                  or client_credential
                  != {
                      "clientSecretSettingName": "oidc-client-secret",
                      "method": "ClientSecretPost",
                  }
                  or configuration != expected_configuration
              ):
                  raise SystemExit("Easy Auth custom OIDC configuration differs from review.")
          else:
              raise SystemExit("The reviewed authentication provider is unsupported.")
          PY

          az rest --method get --uri "${app_uri}/revisions?api-version=2026-01-01" \
            --output json > "$evidence_dir/traffic-before.json"
          az rest --method get --uri "${app_uri}?api-version=2026-01-01" \
            --output json > "$evidence_dir/staged-app.json"
          PREVIOUS_REVISION="$previous_revision" NEW_REVISION="$new_revision" \
            APP_GATEWAY_SUBNET="$app_gateway_subnet" python3 - \
            "$evidence_dir/traffic-before.json" "$evidence_dir/staged-app.json" <<'PY'
          import json
          import os
          import sys

          revisions = json.load(open(sys.argv[1], encoding="utf-8")).get("value", [])
          traffic = {
              item["name"]: int(item.get("properties", {}).get("trafficWeight", 0) or 0)
              for item in revisions
              if int(item.get("properties", {}).get("trafficWeight", 0) or 0) > 0
          }
          expected = (
              {os.environ["PREVIOUS_REVISION"]: 100}
              if os.environ["PREVIOUS_REVISION"]
              else {os.environ["NEW_REVISION"]: 100}
          )
          if traffic != expected:
              raise SystemExit("Previous traffic was not preserved while staging the candidate.")
          ingress = (
              json.load(open(sys.argv[2], encoding="utf-8"))
              .get("properties", {})
              .get("configuration", {})
              .get("ingress", {})
          )
          expected_external = bool(os.environ["PREVIOUS_REVISION"])
          if ingress.get("external") is not expected_external:
              raise SystemExit("Staged application ingress exposure does not match the reviewed posture.")
          restrictions = {
              (item.get("action"), item.get("ipAddressRange"), item.get("name"))
              for item in ingress.get("ipSecurityRestrictions", [])
          }
          expected_restriction = (
              ("Allow", os.environ["APP_GATEWAY_SUBNET"], "application-gateway-only")
              if os.environ["PREVIOUS_REVISION"]
              else ("Deny", "0.0.0.0/0", "staged-deny-all")
          )
          if restrictions != {expected_restriction}:
              raise SystemExit("Staged application ingress restrictions are not fail-closed.")
          PY

          if [[ -n "$previous_revision" ]]; then
            az rest --method get \
              --uri "${app_uri}/revisions/${previous_revision}?api-version=2026-01-01" \
              --output json > "$evidence_dir/previous-revision-before-shift.json"
            python3 - "$evidence_dir/previous-revision-before-shift.json" <<'PY'
          import json
          import sys

          properties = json.load(open(sys.argv[1], encoding="utf-8")).get(
              "properties", {}
          )
          if (
              properties.get("provisioningState") not in {"Provisioned", "Succeeded"}
              or properties.get("runningState") != "Running"
              or properties.get("healthState") != "Healthy"
          ):
              raise SystemExit("The prior revision is not healthy enough for rollback.")
          PY
            verify_public_service "before-shift" || {
              echo "::error::The serving revision failed health or authentication before traffic activation."
              exit 1
            }
          fi

          printf '{"location":"%s","properties":{"configuration":{"ingress":{"external":true,"ipSecurityRestrictions":[{"action":"Allow","description":"Only the regional Application Gateway subnet may reach app ingress.","ipAddressRange":"%s","name":"application-gateway-only"}],"traffic":[{"revisionName":"%s","weight":100}]}}}}\n' \
            "$app_location" "$app_gateway_subnet" "$new_revision" > "$evidence_dir/new-traffic.json"
          traffic_shifted="true"
          az rest --method patch \
            --uri "${app_uri}?api-version=2026-01-01" \
            --body "@$evidence_dir/new-traffic.json" \
            --output none

          public_url="https://${public_host}"
          health_ready="false"
          for _ in $(seq 1 30); do
            live_status="$(curl --proto '=https' --tlsv1.2 --silent --show-error \
              --output /dev/null --write-out '%{http_code}' --max-time 10 \
              "${public_url}/health/live" || true)"
            ready_status="$(curl --proto '=https' --tlsv1.2 --silent --show-error \
              --output /dev/null --write-out '%{http_code}' --max-time 10 \
              "${public_url}/health/ready" || true)"
            if [[ "$live_status" = "200" && "$ready_status" = "200" ]]; then
              health_ready="true"
              break
            fi
            sleep 10
          done
          test "$health_ready" = "true" || {
            echo "::error::Public liveness or readiness verification failed."
            exit 1
          }

          curl --proto '=https' --tlsv1.2 --silent --show-error \
            --dump-header "$evidence_dir/unauthenticated.headers" \
            --output /dev/null --max-time 15 "${public_url}/api/v1/health"
          curl --proto '=https' --tlsv1.2 --silent --show-error \
            --header 'X-MS-CLIENT-PRINCIPAL: forged' \
            --dump-header "$evidence_dir/forged.headers" \
            --output /dev/null --max-time 15 "${public_url}/api/v1/health"
          PUBLIC_HOST="$public_host" python3 - \
            "$evidence_dir/unauthenticated.headers" "$evidence_dir/forged.headers" <<'PY'
          import os
          import sys
          from urllib.parse import urlparse

          def read_response(path):
              lines = open(path, encoding="utf-8").read().splitlines()
              status_lines = [line for line in lines if line.startswith("HTTP/")]
              if not status_lines:
                  raise SystemExit("Authentication response had no HTTP status.")
              status = int(status_lines[-1].split()[1])
              headers = {}
              for line in lines:
                  if ":" in line:
                      name, value = line.split(":", 1)
                      headers[name.strip().lower()] = value.strip()
              return status, headers.get("location", "")

          normal = read_response(sys.argv[1])
          forged = read_response(sys.argv[2])
          if normal[0] != forged[0]:
              raise SystemExit("A forged platform principal header changed authentication status.")
          normalized = []
          for status, location in (normal, forged):
              if status not in (302, 303, 307):
                  raise SystemExit("Unauthenticated application access did not redirect to login.")
              parsed = urlparse(location)
              if parsed.netloc and parsed.hostname != os.environ["PUBLIC_HOST"]:
                  raise SystemExit("Authentication redirect escaped the approved public host.")
              if not parsed.path.startswith("/.auth/"):
                  raise SystemExit("Authentication redirect did not use the platform auth route.")
              normalized.append((parsed.hostname or "", parsed.path))
          if normalized[0] != normalized[1]:
              raise SystemExit("A forged platform principal header changed authentication routing.")
          PY

          backend_fqdn="$(
            python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("properties", {}).get("fqdn", ""))' \
              "$evidence_dir/candidate-revision.json"
          )"
          test -n "$backend_fqdn"
          direct_status="$(curl --proto '=https' --tlsv1.2 --silent --show-error \
            --output /dev/null --write-out '%{http_code}' --connect-timeout 5 --max-time 10 \
            "https://${backend_fqdn}/health/live" || true)"
          case "$direct_status" in
            000 | 401 | 403) ;;
            *)
              echo "::error::The direct revision endpoint was reachable outside Application Gateway."
              exit 1
              ;;
          esac

          workspace_uri="https://management.azure.com/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${resource_group}/providers/Microsoft.OperationalInsights/workspaces/${log_analytics}?api-version=2025-07-01"
          workspace_customer_id="$(
            az rest --method get --uri "$workspace_uri" --query properties.customerId --output tsv
          )"
          test -n "$workspace_customer_id"
          export WEB_APP="$web_app"
          export NEW_REVISION="$new_revision"
          python3 - <<'PY' > "$evidence_dir/log-query.json"
          import json
          import os

          app = os.environ["WEB_APP"].replace("'", "''")
          revision = os.environ["NEW_REVISION"].replace("'", "''")
          query = f"""
          union isfuzzy=true
            (ContainerAppConsoleLogs
              | project TimeGenerated,
                  App=tostring(column_ifexists("ContainerAppName", "")),
                  Revision=tostring(column_ifexists("RevisionName", "")),
                  Message=tostring(column_ifexists("Log", ""))),
            (ContainerAppConsoleLogs_CL
              | project TimeGenerated,
                  App=tostring(column_ifexists("ContainerAppName_s", "")),
                  Revision=tostring(column_ifexists("RevisionName_s", "")),
                  Message=tostring(column_ifexists("Log_s", ""))),
            (AzureDiagnostics
              | where Category == "ContainerAppConsoleLogs"
              | project TimeGenerated,
                  App=tostring(column_ifexists("ContainerAppName_s", "")),
                  Revision=tostring(column_ifexists("RevisionName_s", "")),
                  Message=tostring(column_ifexists("Log_s", "")))
          | where TimeGenerated > ago(7d)
          | where App == '{app}'
          | where Revision == '{revision}'
          | extend Record=parse_json(Message)
          | where tostring(Record.event) == 'telemetry.initialized'
          | where tostring(Record.component) == 'telemetry'
          | where tostring(Record.outcome) == 'skipped'
          | where tostring(Record.telemetryMode) == 'disabled'
          | summarize EvidenceCount=count()
          """
          print(json.dumps({"query": query, "timespan": "P7D"}, separators=(",", ":")))
          PY

          telemetry_initialization_verified="false"
          for _ in $(seq 1 60); do
            if az rest --method post \
              --uri "https://api.loganalytics.io/v1/workspaces/${workspace_customer_id}/query" \
              --resource "https://api.loganalytics.io" \
              --headers Content-Type=application/json \
              --body "@$evidence_dir/log-query.json" \
              --output json \
              > "$evidence_dir/log-query-result.json" \
              2> "$evidence_dir/log-query.error"
            then
              if python3 - "$evidence_dir/log-query-result.json" <<'PY'
          import json
          import sys

          result = json.load(open(sys.argv[1], encoding="utf-8"))
          tables = result.get("tables", [])
          rows = tables[0].get("rows", []) if tables else []
          raise SystemExit(0 if rows and int(rows[0][0]) > 0 else 1)
          PY
              then
                telemetry_initialization_verified="true"
                break
              fi
            fi
            sleep 15
          done
          test "$telemetry_initialization_verified" = "true" || {
            if [[ -s "$evidence_dir/log-query.error" ]]; then
              cat "$evidence_dir/log-query.error" >&2
            fi
            echo "::error::The safe disabled-telemetry initialization signal was not ingested for the new revision."
            exit 1
          }

          az rest --method get --uri "${app_uri}/revisions?api-version=2026-01-01" \
            --output json > "$evidence_dir/traffic-after.json"
          az rest --method get --uri "${app_uri}?api-version=2026-01-01" \
            --output json > "$evidence_dir/app-after.json"
          NEW_REVISION="$new_revision" APP_GATEWAY_SUBNET="$app_gateway_subnet" python3 - \
            "$evidence_dir/traffic-after.json" "$evidence_dir/app-after.json" <<'PY'
          import json
          import os
          import sys

          revisions = json.load(open(sys.argv[1], encoding="utf-8")).get("value", [])
          traffic = {
              item["name"]: int(item.get("properties", {}).get("trafficWeight", 0) or 0)
              for item in revisions
              if int(item.get("properties", {}).get("trafficWeight", 0) or 0) > 0
          }
          if traffic != {os.environ["NEW_REVISION"]: 100}:
              raise SystemExit("The verified candidate does not own exactly 100 percent of traffic.")
          ingress = (
              json.load(open(sys.argv[2], encoding="utf-8"))
              .get("properties", {})
              .get("configuration", {})
              .get("ingress", {})
          )
          restrictions = {
              (item.get("action"), item.get("ipAddressRange"), item.get("name"))
              for item in ingress.get("ipSecurityRestrictions", [])
          }
          expected = {
              ("Allow", os.environ["APP_GATEWAY_SUBNET"], "application-gateway-only")
          }
          if ingress.get("external") is not True or restrictions != expected:
              raise SystemExit("The active application ingress is not restricted to Application Gateway.")
          PY

          export EVIDENCE_DIR="$evidence_dir"
          export PREVIOUS_REVISION="$previous_revision"
          export NEW_REVISION="$new_revision"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          image = json.loads(
              (Path(os.environ["IMAGE_DIR"]) / "image-evidence.json").read_text(encoding="utf-8")
          )
          evidence = {
              **image,
              "previousRevisionName": os.environ["PREVIOUS_REVISION"],
              "activeRevisionName": os.environ["NEW_REVISION"],
              "migrationStatus": "Succeeded",
              "healthVerified": True,
              "authVerified": True,
              "telemetryInitializationVerified": True,
              "telemetryMode": "disabled",
              "priorTrafficPreservedBeforeActivation": True,
              "priorServiceVerifiedBeforeActivation": bool(
                  os.environ["PREVIOUS_REVISION"]
              ),
              "identityPurpose": "migration-runtime",
          }
          root = Path(os.environ["EVIDENCE_DIR"])
          root.joinpath("rollout-evidence.json").write_text(
              json.dumps(evidence, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          (
            cd "$evidence_dir"
            sha256sum rollout-evidence.json > rollout-evidence.sha256
          )
          traffic_shifted="false"
          trap - EXIT

      - name: Upload successful rollout evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-rollout-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            delivery-artifacts/rollout-evidence/rollout-evidence.json
            delivery-artifacts/rollout-evidence/rollout-evidence.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Enforce the prior traffic posture after any failed rollout step
        if: failure() && steps.runtime_login.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          az account show --output json > "$STATE_DIR/rollback-account.json"
          SOURCE_EVIDENCE="$SOURCE_DIR/release-evidence.json" \
            ACCOUNT_PATH="$STATE_DIR/rollback-account.json" \
            EXPECTED_PURPOSE="migrationRuntime" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = json.loads(
              Path(os.environ["SOURCE_EVIDENCE"]).read_text(encoding="utf-8")
          )
          account = json.loads(Path(os.environ["ACCOUNT_PATH"]).read_text(encoding="utf-8"))
          target = evidence["azureTarget"]
          identities = evidence["federatedClientIds"]
          if (
              str(account.get("tenantId", "")).lower() != target["tenantId"]
              or str(account.get("id", "")).lower() != target["subscriptionId"]
              or str(account.get("user", {}).get("type", "")).lower()
              != "serviceprincipal"
              or str(account.get("user", {}).get("name", "")).lower()
              != identities[os.environ["EXPECTED_PURPOSE"]]
          ):
              raise SystemExit("Rollback identity or Azure target is not reviewed.")
          PY
          readarray -t values < <(
            python3 - "$CONFIG_PATH" "$PLAN_DIR/application-plan-evidence.json" <<'PY'
          import json
          import sys

          config = json.load(open(sys.argv[1], encoding="utf-8"))
          plan = json.load(open(sys.argv[2], encoding="utf-8"))
          print(config["names"]["resourceGroup"])
          print(config["names"]["webContainerApp"])
          print(config["primaryLocation"])
          print(plan["previousRevisionName"])
          print(plan["newRevisionName"])
          print(config["network"]["subnets"]["applicationGateway"])
          print(config["dns"]["publicHost"])
          PY
          )
          resource_group="${values[0]}"
          web_app="${values[1]}"
          app_location="${values[2]}"
          previous_revision="${values[3]}"
          new_revision="${values[4]}"
          app_gateway_subnet="${values[5]}"
          public_host="${values[6]}"
          app_uri="https://management.azure.com/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${resource_group}/providers/Microsoft.App/containerApps/${web_app}"
          if [[ -n "$previous_revision" ]]; then
            printf '{"location":"%s","properties":{"configuration":{"ingress":{"external":true,"ipSecurityRestrictions":[{"action":"Allow","description":"Only the regional Application Gateway subnet may reach app ingress.","ipAddressRange":"%s","name":"application-gateway-only"}],"traffic":[{"revisionName":"%s","weight":100}]}}}}\n' \
              "$app_location" "$app_gateway_subnet" "$previous_revision" > rollback-traffic.json
          else
            printf '{"location":"%s","properties":{"configuration":{"ingress":{"external":false,"ipSecurityRestrictions":[{"action":"Deny","description":"First-bootstrap candidate remains unreachable until post-migration acceptance.","ipAddressRange":"0.0.0.0/0","name":"staged-deny-all"}],"traffic":[{"revisionName":"%s","weight":100}]}}}}\n' \
              "$app_location" "$new_revision" > rollback-traffic.json
          fi
          az rest --method patch \
            --uri "${app_uri}?api-version=2026-01-01" \
            --body @rollback-traffic.json \
            --output none
          if [[ -n "$previous_revision" ]]; then
            az rest --method post \
              --uri "${app_uri}/revisions/${new_revision}/deactivate?api-version=2026-01-01" \
              --output none || echo "::warning::Candidate revision deactivation failed after rollback."
          fi

          rollback_verified="false"
          for _ in $(seq 1 12); do
            az rest --method get \
              --uri "${app_uri}/revisions?api-version=2026-01-01" \
              --output json > rollback-revisions.json
            az rest --method get \
              --uri "${app_uri}?api-version=2026-01-01" \
              --output json > rollback-app.json
            if PREVIOUS_REVISION="$previous_revision" NEW_REVISION="$new_revision" \
              APP_GATEWAY_SUBNET="$app_gateway_subnet" \
              python3 - rollback-revisions.json rollback-app.json <<'PY'
          import json
          import os
          import sys

          revisions = json.load(open(sys.argv[1], encoding="utf-8")).get("value", [])
          traffic = {
              item["name"]: int(item.get("properties", {}).get("trafficWeight", 0) or 0)
              for item in revisions
              if int(item.get("properties", {}).get("trafficWeight", 0) or 0) > 0
          }
          previous = os.environ["PREVIOUS_REVISION"]
          expected = {previous: 100} if previous else {os.environ["NEW_REVISION"]: 100}
          ingress = (
              json.load(open(sys.argv[2], encoding="utf-8"))
              .get("properties", {})
              .get("configuration", {})
              .get("ingress", {})
          )
          expected_restriction = (
              ("Allow", os.environ["APP_GATEWAY_SUBNET"], "application-gateway-only")
              if previous
              else ("Deny", "0.0.0.0/0", "staged-deny-all")
          )
          restrictions = {
              (item.get("action"), item.get("ipAddressRange"), item.get("name"))
              for item in ingress.get("ipSecurityRestrictions", [])
          }
          safe = (
              traffic == expected
              and ingress.get("external") is bool(previous)
              and restrictions == {expected_restriction}
          )
          raise SystemExit(0 if safe else 1)
          PY
            then
              rollback_verified="true"
              break
            fi
            sleep 5
          done
          test "$rollback_verified" = "true" || {
            echo "::error::Failed rollout left an unverified traffic posture; immediate operator action is required."
            exit 1
          }
          if [[ -n "$previous_revision" ]]; then
            service_recovered="false"
            public_url="https://${public_host}"
            for _ in $(seq 1 30); do
              live_status="$(curl --proto '=https' --tlsv1.2 --silent --show-error \
                --output /dev/null --write-out '%{http_code}' --max-time 10 \
                "${public_url}/health/live" || true)"
              ready_status="$(curl --proto '=https' --tlsv1.2 --silent --show-error \
                --output /dev/null --write-out '%{http_code}' --max-time 10 \
                "${public_url}/health/ready" || true)"
              if [[ "$live_status" = "200" && "$ready_status" = "200" ]]; then
                service_recovered="true"
                break
              fi
              sleep 10
            done
            test "$service_recovered" = "true"
            curl --proto '=https' --tlsv1.2 --silent --show-error \
              --dump-header rollback-unauthenticated.headers \
              --output /dev/null --max-time 15 "${public_url}/api/v1/health"
            curl --proto '=https' --tlsv1.2 --silent --show-error \
              --header 'X-MS-CLIENT-PRINCIPAL: forged' \
              --dump-header rollback-forged.headers \
              --output /dev/null --max-time 15 "${public_url}/api/v1/health"
            PUBLIC_HOST="$public_host" python3 - \
              rollback-unauthenticated.headers rollback-forged.headers <<'PY'
          import os
          import sys
          from urllib.parse import urlparse

          def read_response(path):
              lines = open(path, encoding="utf-8").read().splitlines()
              status_lines = [line for line in lines if line.startswith("HTTP/")]
              if not status_lines:
                  raise SystemExit("Recovered service returned no HTTP status.")
              status = int(status_lines[-1].split()[1])
              headers = {}
              for line in lines:
                  if ":" in line:
                      name, value = line.split(":", 1)
                      headers[name.strip().lower()] = value.strip()
              return status, headers.get("location", "")

          normal = read_response(sys.argv[1])
          forged = read_response(sys.argv[2])
          if normal[0] != forged[0]:
              raise SystemExit("Forged principal changed recovered authentication status.")
          normalized = []
          for status, location in (normal, forged):
              if status not in (302, 303, 307):
                  raise SystemExit("Recovered service did not enforce authentication.")
              parsed = urlparse(location)
              if parsed.netloc and parsed.hostname != os.environ["PUBLIC_HOST"]:
                  raise SystemExit("Recovered authentication redirect escaped public host.")
              if not parsed.path.startswith("/.auth/"):
                  raise SystemExit("Recovered service did not use the platform auth route.")
              normalized.append((parsed.hostname or "", parsed.path))
          if normalized[0] != normalized[1]:
              raise SystemExit("Forged principal changed recovered authentication routing.")
          PY
          fi
          echo "::error::Prior service recovery was verified; reviewed non-traffic infrastructure changes remain and require operator review."

      - name: Clear Azure session and protected files
        if: always()
        shell: bash
        run: |
          az logout >/dev/null 2>&1 || true
          az account clear >/dev/null 2>&1 || true
          rm -rf delivery-artifacts "$AZURE_CONFIG_DIR"
          rm -f \
            rollback-traffic.json \
            rollback-revisions.json \
            rollback-app.json \
            rollback-unauthenticated.headers \
            rollback-forged.headers

name: Browser smoke and accessibility

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"
  RUNTIME_MODE: production
  DATABASE_MODE: disabled
  AUTH_MODE: container-apps
  LOGGING_MODE: json
  TELEMETRY_MODE: disabled
  NEXT_PUBLIC_RUNTIME_MODE: production

jobs:
  e2e:
    name: Production server smoke and WCAG
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install exact pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0
          run_install: false

      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Restore trusted Playwright browser cache
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium and operating-system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @repo/web exec playwright install --with-deps chromium

      - name: Install Chromium operating-system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @repo/web exec playwright install-deps chromium

      - name: Build production application
        run: pnpm build

      - name: Run Playwright smoke and WCAG suite
        run: pnpm e2e

      - name: Save trusted Playwright browser cache
        if: >-
          success() && github.event_name == 'push' && github.ref == format('refs/heads/{0}',
          github.event.repository.default_branch) && steps.playwright-cache.outputs.cache-hit !=
          'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

version: 2

updates:
  - package-ecosystem: npm # pnpm workspace
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      pnpm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "10:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
